<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141110" />
  <title>ADN Minero · Wincha de noticias</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="Wincha de titulares de la minería de Chile en vivo. Fuente: Google Noticias." />
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    html, body { height:100%; margin:0; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; background:transparent; overflow:hidden; }
    /* La página es transparente (sirve como overlay en OBS); solo la barra tiene fondo */
    #wincha {
      position:fixed; left:0; right:0; bottom:0; height:58px; display:flex; align-items:stretch;
      background:linear-gradient(180deg, rgba(26,21,18,.97), rgba(20,17,16,.98));
      border-top:2px solid #b5734f; box-shadow:0 -6px 24px rgba(0,0,0,.5); color:#f0e6da;
    }
    #brand {
      display:flex; align-items:center; gap:10px; padding:0 20px; flex-shrink:0;
      background:linear-gradient(160deg,#b5734f,#8a5638); color:#fff; font-weight:800; letter-spacing:.02em;
      clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
      padding-right:34px;
    }
    #brand .dot { width:9px; height:9px; border-radius:50%; background:#7ee787; box-shadow:0 0 8px #7ee787; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #track-wrap { flex:1; overflow:hidden; position:relative; display:flex; align-items:center; }
    #track { display:inline-flex; white-space:nowrap; will-change:transform; }
    .copy { display:inline-flex; align-items:center; }
    .item { display:inline-flex; align-items:center; font-size:19px; font-weight:600; padding:0 4px; }
    .item .src { color:#c9a888; font-weight:500; margin-left:8px; font-size:16px; }
    .sep { color:#b5734f; font-size:16px; padding:0 22px; }
    #time { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:0 18px; background:rgba(181,115,79,.12); border-left:1px solid rgba(196,168,148,.18); color:#e8c9a6; font-weight:700; font-variant-numeric:tabular-nums; }
    /* fade en los bordes del track */
    #track-wrap::before, #track-wrap::after { content:''; position:absolute; top:0; bottom:0; width:40px; z-index:2; pointer-events:none; }
    #track-wrap::before { left:0; background:linear-gradient(90deg, rgba(20,17,16,1), transparent); }
    #track-wrap::after { right:0; background:linear-gradient(270deg, rgba(20,17,16,1), transparent); }
  </style>
<style>/* movil: ocultar hora */@media (max-width:820px){#clock,#clockDate{display:none!important}*:has(> #clock){display:none!important}}</style>
  <script src="adn-ui.js" defer></script>
</head>
<body>
  <div id="wincha">
    <div id="brand"><span class="dot"></span> ADN&nbsp;MINERO <span style="opacity:.8;font-weight:600">· NOTICIAS</span></div>
    <div id="track-wrap"><div id="track"></div></div>
    <div id="time"><i data-lucide="clock" class="w-4 h-4"></i><span id="clock">--:--</span></div>
  </div>

<script>
  const TZ = 'America/Santiago';
  const GNEWS = 'https://news.google.com/rss/search?q=' + encodeURIComponent('minería Chile cobre litio') + '&hl=es-419&gl=CL&ceid=CL:es';
  const API = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(GNEWS);
  const REFRESH_MS = 15 * 60 * 1000;

  // Respaldo: si la fuente falla, la wincha nunca queda vacía
  const FALLBACK = [
    { t:'Chile es el mayor productor de cobre del mundo, con cerca de un cuarto de la producción global', s:'ADN Minero' },
    { t:'El litio chileno es clave para las baterías y la transición energética mundial', s:'ADN Minero' },
    { t:'La minería aporta una parte importante del PIB y de las exportaciones de Chile', s:'ADN Minero' },
    { t:'El royalty minero se distribuye a cientos de comunas de todo el país', s:'ADN Minero' },
    { t:'Codelco es la mayor productora de cobre del planeta', s:'ADN Minero' },
    { t:'Chile lidera el mundo en cobre y renio, y es 2º en litio', s:'ADN Minero' },
  ];

  const $ = id => document.getElementById(id);
  function tick(){ $('clock').textContent = new Date().toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}); }

  function limpia(titulo){
    // Google News: "Titular - Fuente" -> separa
    const i = titulo.lastIndexOf(' - ');
    if (i > 20) return { t: titulo.slice(0,i).trim(), s: titulo.slice(i+3).trim() };
    return { t: titulo.trim(), s: '' };
  }
  function itemHTML(n){ return `<span class="item">${n.t}${n.s?`<span class="src">· ${n.s}</span>`:''}</span><span class="sep">◆</span>`; }
  function copyHTML(list){ return `<div class="copy">${list.map(itemHTML).join('')}</div>`; }

  let scrollX = 0, lastT = 0, rafId = null, firstCopyW = 0;
  const SPEED = 62; // px/seg
  function buildTrack(list){
    const tr = $('track');
    tr.innerHTML = copyHTML(list) + copyHTML(list);   // dos copias -> loop sin cortes
    scrollX = 0; tr.style.transform = 'translateX(0)';
    firstCopyW = tr.firstElementChild ? tr.firstElementChild.offsetWidth : tr.scrollWidth/2;
  }
  function frame(now){
    if (!lastT) lastT = now; const dt = Math.min(0.05,(now-lastT)/1000); lastT = now;
    scrollX -= SPEED*dt;
    if (firstCopyW && -scrollX >= firstCopyW) scrollX += firstCopyW;
    $('track').style.transform = `translateX(${scrollX}px)`;
    rafId = requestAnimationFrame(frame);
  }
  function startScroll(){ if (rafId) return; lastT = 0; rafId = requestAnimationFrame(frame); }
  function stopScroll(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }

  async function load(){
    let list = null;
    try {
      const r = await fetch(API, { cache:'no-store' });
      const j = await r.json();
      if (j && j.status === 'ok' && Array.isArray(j.items) && j.items.length){
        list = j.items.slice(0,18).map(it => limpia(it.title || ''))
                 .filter(n => n.t && n.t.length > 12);
      }
    } catch(e){ /* usa respaldo */ }
    if (!list || !list.length) list = FALLBACK;
    buildTrack(list);
    startScroll();
    clearTimeout(load._t); load._t = setTimeout(load, REFRESH_MS);
  }

  lucide.createIcons(); tick(); setInterval(tick, 1000); load();
  window.addEventListener('resize', () => { const tr=$('track'); if (tr.firstElementChild) firstCopyW = tr.firstElementChild.offsetWidth; });
  document.addEventListener('visibilitychange', () => { document.hidden ? stopScroll() : startScroll(); });
</script>
</body>
</html>
