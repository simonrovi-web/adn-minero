<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADN Minero · Wincha Automática (todas)</title>
  <style>
    html,body{height:100%;margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
    .fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transition:opacity .6s ease}
    .fr.on{opacity:1}
  </style>
</head>
<body>
  <iframe id="fa" class="fr" scrolling="no" allowtransparency="true"></iframe>
  <iframe id="fb" class="fr" scrolling="no" allowtransparency="true"></iframe>
<script>
  // Todas las winchas, en orden (primero las de datos en vivo)
  const WINCHAS = [
    'wincha-noticias.html','wincha-commodities.html','wincha-indicadores.html','wincha-sismos.html','wincha-clima.html','wincha-mar.html',
    'wincha-litio.html','wincha-cobre-transicion.html','wincha-geopolitica.html','wincha-estrategia.html','wincha-chile-mundo.html',
    'wincha-empresas.html','wincha-produccion.html','wincha-cartera.html','wincha-aporte-fiscal.html','wincha-royalty.html','wincha-historico.html','wincha-cuenta-publica.html',
    'wincha-mapa.html','wincha-faena.html','wincha-semaforo.html','wincha-alertas.html',
    'wincha-historia.html','wincha-efemerides.html','wincha-glosario.html','wincha-trivia.html','wincha-seguridad.html','wincha-normativa.html','wincha-ambiente.html',
    'wincha-mujer.html','wincha-educacion.html','wincha-calculadora.html',
    'wincha-tv.html','wincha-ia.html','wincha-empleos.html','wincha-muro.html','wincha-promo.html'
  ];

  // Duración por wincha (segundos). Cambia con ?min=2  o  ?seg=120
  const p = new URLSearchParams(location.search);
  let SECONDS = 120;
  if (p.get('seg')) SECONDS = Math.max(10, parseInt(p.get('seg'),10) || 120);
  else if (p.get('min')) SECONDS = Math.max(10, Math.round(parseFloat(p.get('min'))*60) || 120);
  // Filtrar a un subconjunto opcional: ?only=commodities,sismos
  let LIST = WINCHAS;
  const only = p.get('only');
  if (only) {
    const want = only.split(',').map(s=>s.trim().toLowerCase());
    LIST = WINCHAS.filter(w => want.some(x => w.includes(x)));
    if (!LIST.length) LIST = WINCHAS;
  }

  const fa = document.getElementById('fa'), fb = document.getElementById('fb');
  let i = 0;
  let active = fa, hidden = fb;

  function loadInto(frame, url){ return new Promise(res=>{
    let done=false; const finish=()=>{ if(!done){done=true;res();} };
    frame.onload = finish;
    frame.src = url;
    setTimeout(finish, 1500); // por si onload no dispara
  });}

  async function swapTo(idx){
    const url = LIST[idx];
    await loadInto(hidden, url);       // carga la siguiente en el iframe oculto
    hidden.classList.add('on');        // fundido de entrada
    active.classList.remove('on');     // fundido de salida
    const tmp = active; active = hidden; hidden = tmp;  // intercambia roles
  }

  function scheduleNext(){ setTimeout(tick, SECONDS * 1000); }
  async function tick(){
    i = (i + 1) % LIST.length;
    await swapTo(i);
    scheduleNext();               // el siguiente cambio arranca recién cuando termina este → sin solapes
  }
  async function start(){
    await loadInto(active, LIST[0]);
    active.classList.add('on');
    scheduleNext();
  }
  start();
</script>
</body>
</html>
