<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141110" />
  <title>ADN Minero · Wordle Minero</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="Wordle Minero: Adivina la palabra minera de 5 letras del día. Una nueva cada jornada, con pistas y racha." />
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root{ --copper:#cf9b6f; --ok:#6aaa64; --present:#c9a94a; --absent:#3a332d; }
    *{box-sizing:border-box}
    html,body{ margin:0; font-family:'Inter', system-ui, sans-serif; color:#f4ece5; }
    body{ min-height:100vh; background:
      radial-gradient(1000px 600px at 12% -8%, rgba(214,169,79,0.10), transparent 60%), #141110; }
    .wrap{ max-width:460px; margin:0 auto; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; min-height:100dvh; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.6), rgba(26,21,18,0.44)); border:1px solid rgba(196,168,148,0.14); }
    #grid{ display:grid; grid-template-rows:repeat(6,1fr); gap:6px; margin:auto 0; }
    .row{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .tile{ aspect-ratio:1; display:grid; place-items:center; font-size:clamp(20px,7vw,30px); font-weight:800; text-transform:uppercase;
      border:2px solid rgba(196,168,148,.28); border-radius:9px; background:transparent; transition:transform .1s ease; }
    .tile.filled{ border-color:rgba(196,168,148,.55); animation:pop .12s ease }
    @keyframes pop{ from{transform:scale(.9)} to{transform:scale(1)} }
    .tile.ok{ background:var(--ok); border-color:var(--ok); color:#fff }
    .tile.present{ background:var(--present); border-color:var(--present); color:#fff }
    .tile.absent{ background:var(--absent); border-color:var(--absent); color:#cdbfae }
    .flip{ animation:flip .5s ease both }
    @keyframes flip{ 0%{transform:rotateX(0)} 50%{transform:rotateX(90deg)} 100%{transform:rotateX(0)} }
    #kb{ display:grid; gap:6px; margin-top:12px }
    .krow{ display:flex; gap:5px; justify-content:center }
    .key{ flex:1; max-width:38px; height:52px; border:0; border-radius:7px; background:#4a4139; color:#f4ece5; font-weight:800; font-size:15px; cursor:pointer; display:grid; place-items:center; text-transform:uppercase; transition:transform .08s ease }
    .key:active{ transform:scale(.92) }
    .key.wide{ max-width:60px; font-size:11px }
    .key.ok{ background:var(--ok);color:#fff } .key.present{ background:var(--present);color:#fff } .key.absent{ background:#2a251f;color:#8a8079 }
    #toast{ position:fixed; left:50%; top:74px; transform:translateX(-50%) translateY(-14px); background:#f0e6d8; color:#241a12; font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:.2s; z-index:50 }
    #toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
    .shake{ animation:shake .4s } @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .hidden{ display:none !important }
  </style>
  <script src="adn-ui.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="h-9 w-9 rounded-lg grid place-items-center shrink-0" style="background:rgba(106,170,100,.16);border:1px solid rgba(106,170,100,.4)"><i data-lucide="grid-3x3" style="width:19px;height:19px;color:#8bcf85"></i></div>
        <div class="min-w-0">
          <p style="margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9d3b0;font-weight:800">Wordle Minero</p>
          <p style="margin:0;font-size:10px;color:#9c8f83">La palabra minera del día</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold px-2.5 py-1 rounded-full glass">🔥 <b id="streak">0</b></span>
        <button id="help" class="text-xs px-2.5 py-1 rounded-full glass" title="Cómo jugar"><i data-lucide="help-circle" style="width:15px;height:15px"></i></button>
      </div>
    </div>

    <div id="grid" class="mt-3"></div>

    <div id="msgArea" class="text-center min-h-[20px] mt-2"></div>

    <div id="kb"></div>

    <p class="text-center text-[11px] text-stone-500 mt-3"><a href="adn-minero-juegos.html" style="color:#e8c9a6">🎮 Juegos</a> · <a href="index.html" style="color:#e8c9a6">Inicio</a></p>
  </div>

  <div id="toast"></div>

  <!-- Ayuda / Fin -->
  <div id="modal" class="hidden" style="position:fixed;inset:0;z-index:60;background:rgba(10,8,7,.6);display:flex;align-items:center;justify-content:center;padding:20px">
    <div class="glass rounded-2xl p-5 text-center" style="max-width:340px">
      <div id="mEmoji" class="text-4xl mb-1">📖</div>
      <h2 id="mTitle" class="text-xl font-black">Cómo jugar</h2>
      <div id="mBody" class="text-sm text-stone-300 mt-2 leading-relaxed text-left"></div>
      <button id="mClose" class="mt-4 w-full rounded-xl py-3 font-bold active:scale-95 transition" style="background:linear-gradient(150deg,#e8c9a6,#cf9b6f);color:#211a15">Entendido</button>
    </div>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const drawIcons=()=>window.lucide&&lucide.createIcons();

  // Palabras de 5 letras (may.), con pista. La del día es la misma para todos.
  const WORDS=[
    {w:'COBRE', h:'El metal rey de la minería chilena.'},
    {w:'LITIO', h:'El “oro blanco” de los salares.'},
    {w:'PLATA', h:'Metal precioso y gran conductor.'},
    {w:'MINAS', h:'Lugares donde se extrae el mineral.'},
    {w:'VETAS', h:'Filones de mineral dentro de la roca.'},
    {w:'CASCO', h:'EPP que protege la cabeza en faena.'},
    {w:'FAENA', h:'El sitio donde opera la mina.'},
    {w:'SALAR', h:'De aquí se obtiene el litio.'},
    {w:'METAL', h:'Material que se extrae y se funde.'},
    {w:'POLVO', h:'Resultado de moler finamente la roca.'},
    {w:'CATEO', h:'Búsqueda o exploración de minerales.'},
    {w:'LEYES', h:'Miden la concentración del mineral.'},
    {w:'PIQUE', h:'Pozo vertical de una mina subterránea.'},
    {w:'BORAX', h:'Mineral de boro típico del norte.'},
    {w:'CROMO', h:'Metal usado en aleaciones duras.'},
    {w:'BOTAS', h:'Calzado de seguridad del minero.'},
    {w:'PALAS', h:'Cargan el mineral en los camiones.'},
    {w:'HORNO', h:'Donde se funde el metal para refinarlo.'},
    {w:'CINTA', h:'Correa transportadora del mineral.'},
    {w:'DIQUE', h:'Muro que contiene un depósito de relave.'},
    {w:'SONDA', h:'Perfora el subsuelo para explorar (sondaje).'},
    {w:'ANDES', h:'La cordillera de gran parte de la minería.'},
    {w:'BARRA', h:'Forma en que se funde y transporta el metal.'},
    {w:'ONZAS', h:'Unidad para pesar el oro.'},
    {w:'ROCAS', h:'Material que se extrae y procesa.'},
    {w:'ARIDO', h:'Material pétreo (arena, grava) para construcción.'},
    {w:'VAGON', h:'Transporta mineral sobre rieles.'},
    {w:'GRUAS', h:'Levantan cargas pesadas en la faena.'},
    {w:'TOLVA', h:'Recibe y dosifica el mineral.'},
    {w:'PLOMO', h:'Metal pesado, a veces subproducto de la minería.'},
    {w:'MALLA', h:'Patrón de perforación para una tronadura.'},
    {w:'AGUAS', h:'Recurso clave y escaso en el desierto.'},
    {w:'GASES', h:'Se monitorean en la mina subterránea.'},
    {w:'LODOS', h:'Residuos finos que deja el proceso.'},
    {w:'RELVE', h:'(no)', skip:true}
  ].filter(x=>!x.skip);

  // Índice del día (determinista)
  const epoch=Date.UTC(2026,0,1);
  const dayNum=Math.floor((Date.now() - epoch)/864e5);
  const todayIdx=((dayNum % WORDS.length)+WORDS.length)%WORDS.length;
  const ANSWER=WORDS[todayIdx].w, HINT=WORDS[todayIdx].h;
  const dateKey=new Date().toISOString().slice(0,10);

  const ROWS=6, COLS=5;
  let row=0, col=0, cur='', done=false, board=[];
  const keyState={}; // letra -> ok/present/absent (mejor estado)

  // Estado persistente por día + racha
  const ST_KEY='adn_wordle';
  function loadState(){ try{ return JSON.parse(localStorage.getItem(ST_KEY)||'{}'); }catch(e){ return {}; } }
  function saveState(s){ try{ localStorage.setItem(ST_KEY, JSON.stringify(s)); }catch(e){} }
  let state=loadState();
  $('streak').textContent=state.streak||0;

  function buildGrid(){
    const g=$('grid'); g.innerHTML='';
    for(let r=0;r<ROWS;r++){ const rw=document.createElement('div'); rw.className='row'; rw.id='row'+r;
      board[r]=[];
      for(let c=0;c<COLS;c++){ const t=document.createElement('div'); t.className='tile'; t.id='t'+r+'_'+c; rw.appendChild(t); board[r][c]=t; }
      g.appendChild(rw);
    }
  }
  const KEYS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','Ñ'],['ENVIAR','Z','X','C','V','B','N','M','⌫']];
  function buildKb(){
    const kb=$('kb'); kb.innerHTML='';
    KEYS.forEach(rowk=>{ const kr=document.createElement('div'); kr.className='krow';
      rowk.forEach(k=>{ const b=document.createElement('button'); b.className='key'+((k==='ENVIAR'||k==='⌫')?' wide':''); b.textContent=k; b.dataset.k=k;
        b.addEventListener('click',()=>press(k)); kr.appendChild(b); });
      kb.appendChild(kr);
    });
  }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1400); }

  function press(k){
    if(done) return;
    if(k==='⌫'||k==='BACKSPACE'){ if(col>0){ col--; cur=cur.slice(0,-1); board[row][col].textContent=''; board[row][col].classList.remove('filled'); } return; }
    if(k==='ENVIAR'||k==='ENTER'){ submit(); return; }
    if(!/^[A-ZÑ]$/.test(k)) return;
    if(col<COLS){ board[row][col].textContent=k; board[row][col].classList.add('filled'); cur+=k; col++; }
  }

  function submit(){
    if(col<COLS){ toast('Faltan letras'); $('row'+row).classList.add('shake'); setTimeout(()=>$('row'+row).classList.remove('shake'),400); return; }
    const guess=cur;
    // calcular estados
    const res=Array(COLS).fill('absent');
    const ansArr=ANSWER.split(''); const used=Array(COLS).fill(false);
    for(let i=0;i<COLS;i++){ if(guess[i]===ansArr[i]){ res[i]='ok'; used[i]=true; } }
    for(let i=0;i<COLS;i++){ if(res[i]==='ok') continue;
      for(let j=0;j<COLS;j++){ if(!used[j] && guess[i]===ansArr[j]){ res[i]='present'; used[j]=true; break; } } }
    // pintar con flip escalonado
    for(let i=0;i<COLS;i++){ const t=board[row][i];
      setTimeout(()=>{ t.classList.add('flip'); setTimeout(()=>{ t.classList.add(res[i]); },250); }, i*180);
      // teclado
      const kEl=document.querySelector('.key[data-k="'+guess[i]+'"]'); const prev=keyState[guess[i]];
      const rank={absent:0,present:1,ok:2};
      if(kEl && (!prev || rank[res[i]]>rank[prev])){ keyState[guess[i]]=res[i]; setTimeout(()=>{ kEl.classList.remove('ok','present','absent'); kEl.classList.add(res[i]); }, COLS*180); }
    }
    const win=guess===ANSWER;
    setTimeout(()=>{
      if(win){ finish(true); }
      else { row++; col=0; cur=''; if(row>=ROWS){ finish(false); } }
    }, COLS*180+300);
  }

  function finish(win){
    done=true;
    // actualizar racha (solo una vez por día)
    if(state.lastDate!==dateKey){
      if(win){ state.streak=(state.lastWin && isYesterday(state.lastDate))?(state.streak||0)+1:1; state.lastWin=true; }
      else { state.streak=0; state.lastWin=false; }
      state.lastDate=dateKey; saveState(state);
      $('streak').textContent=state.streak||0;
    }
    setTimeout(()=>showEnd(win),300);
  }
  function isYesterday(d){ if(!d) return false; const y=new Date(); y.setDate(y.getDate()-1); return d===y.toISOString().slice(0,10); }

  function showEnd(win){
    $('mEmoji').textContent = win?['🎉','⛏️','💎','🏆'][Math.min(row,3)]:'🧑‍🏭';
    $('mTitle').textContent = win?'¡Correcto!':'¡Casi!';
    $('mBody').innerHTML = (win?('Lo sacaste en <b>'+(row+1)+'</b> intento'+(row?'s':'')+'. '):('La palabra era <b>'+ANSWER+'</b>. '))+
      '<br><br><b>'+ANSWER+'</b>: '+HINT+
      '<br><br><span style="color:#9c8f83">Vuelve mañana por una nueva palabra minera. 🔁</span>';
    $('mClose').textContent='Cerrar';
    $('modal').classList.remove('hidden');
  }

  function showHelp(){
    $('mEmoji').textContent='📖'; $('mTitle').textContent='Cómo jugar'; $('mClose').textContent='Entendido';
    $('mBody').innerHTML='Adivina la <b>palabra minera de 5 letras</b> en 6 intentos.<br><br>'+
      '🟩 Letra correcta y en su lugar.<br>🟨 Letra en la palabra, pero en otro lugar.<br>⬛ Letra que no está.<br><br>'+
      '<span style="color:#9c8f83">Pista de hoy: '+HINT+'</span>';
    $('modal').classList.remove('hidden');
  }

  // ¿ya jugó hoy? → mostrar resultado y bloquear
  function checkPlayedToday(){
    if(state.lastDate===dateKey){
      done=true;
      toast(state.lastWin?'Ya resolviste el de hoy 🎉':'Ya jugaste hoy');
      setTimeout(()=>showEnd(!!state.lastWin), 500);
    }
  }

  document.addEventListener('keydown', e=>{
    if(!$('modal').classList.contains('hidden')){ if(e.key==='Enter'||e.key==='Escape') $('modal').classList.add('hidden'); return; }
    const k=e.key.toUpperCase();
    if(k==='BACKSPACE') press('⌫'); else if(k==='ENTER') press('ENVIAR'); else if(/^[A-ZÑ]$/.test(k)) press(k);
  });
  $('help').addEventListener('click', showHelp);
  $('mClose').addEventListener('click', ()=>$('modal').classList.add('hidden'));

  buildGrid(); buildKb(); drawIcons(); checkPlayedToday();
</script>
</body>
</html>
