<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADN Minero · Mapa Minero de Chile</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    :root{ --copper:#cf9b6f; }
    *{box-sizing:border-box}
    html,body{ height:100%; margin:0; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; background:#141110; color:#f4ece5; overflow:hidden; }
    #map{ position:fixed; inset:0; z-index:0; background:#141110; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.82), rgba(26,21,18,0.72)); backdrop-filter:blur(14px) saturate(130%); -webkit-backdrop-filter:blur(14px) saturate(130%); border:1px solid rgba(196,168,148,0.16); box-shadow:0 8px 30px rgba(0,0,0,0.5); }
    #topbar{ position:fixed; top:14px; left:14px; right:14px; z-index:1000; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:16px; padding:10px 16px; pointer-events:auto; }
    #legend{ position:fixed; left:14px; bottom:14px; z-index:1000; border-radius:14px; padding:12px 14px; font-size:12px; }
    #legend h4{ margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#c9b7a5; font-weight:700; }
    .lg-row{ display:flex; align-items:center; gap:8px; margin:5px 0; cursor:pointer; user-select:none; opacity:.95; }
    .lg-row.off{ opacity:.35; }
    .lg-dot{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 6px currentColor; border:2px solid rgba(255,255,255,.85); }
    .count{ position:fixed; right:14px; bottom:14px; z-index:1000; border-radius:12px; padding:8px 12px; font-size:12px; color:#e6d4c4; }
    .metric-icon{ filter:drop-shadow(0 0 8px currentColor); }
    .leaflet-popup-content-wrapper{ background:#241d18; color:#f4ece5; border-radius:14px; border:1px solid rgba(196,168,148,.22); box-shadow:0 10px 34px rgba(0,0,0,.6); }
    .leaflet-popup-tip{ background:#241d18; border:1px solid rgba(196,168,148,.22); }
    .leaflet-popup-content{ margin:12px 14px; font-size:13px; line-height:1.5; }
    .leaflet-container a.leaflet-popup-close-button{ color:#c9b7a5; }
    .pop-t{ font-size:15px; font-weight:800; margin-bottom:2px; }
    .pop-m{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:999px; margin-top:6px; }
    .pop-r{ color:#c9b7a5; font-size:12px; margin-top:4px; display:flex; align-items:center; gap:5px; }
    .leaflet-bar a{ background:#2b2520; color:#e6d4c4; border-color:rgba(196,168,148,.2); }
    .leaflet-bar a:hover{ background:#3a3129; }
    .leaflet-tooltip.region-tip{ background:#241d18; color:#f0e2d3; border:1px solid rgba(196,168,148,.32); box-shadow:0 6px 20px rgba(0,0,0,.5); font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; }
    .leaflet-tooltip.region-tip::before{ display:none; }
    .region-label{ color:#efd9bd; font-size:10px; font-weight:700; letter-spacing:.02em; white-space:nowrap; text-shadow:0 1px 3px #000, 0 0 6px #000, 0 0 2px #000; pointer-events:none; transform:translate(-50%,-50%); opacity:.9; }
    #searchWrap{ position:relative; flex:1 1 240px; min-width:0; max-width:440px; }
    #searchBox{ display:flex; align-items:center; gap:8px; background:rgba(20,17,15,.55); border:1px solid rgba(196,168,148,.22); border-radius:11px; padding:8px 11px; }
    #searchBox i{ width:17px; height:17px; color:#c9b7a5; flex:0 0 auto; }
    #mapq{ flex:1 1 auto; min-width:0; background:transparent; border:0; outline:0; color:#f4ece5; font-size:14px; font-family:inherit; }
    #mapq::placeholder{ color:#8a8079; }
    #mapq::-webkit-search-cancel-button{ -webkit-appearance:none; }
    #mapqx{ background:transparent; border:0; color:#a99e92; cursor:pointer; font-size:14px; line-height:1; padding:2px 4px; flex:0 0 auto; }
    #mapres{ position:absolute; top:calc(100% + 7px); left:0; right:0; max-height:min(54vh,360px); overflow:auto; border-radius:13px; padding:5px; z-index:1200; display:none; }
    #mapres.on{ display:block; }
    .mres{ display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:9px; cursor:pointer; }
    .mres:hover, .mres.sel{ background:rgba(207,155,111,.18); }
    .mres .ic{ width:22px; text-align:center; font-size:15px; flex:0 0 auto; }
    .mres .tt{ min-width:0; }
    .mres .tt b{ font-size:13px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mres .tt span{ font-size:11px; color:#a99e92; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mres.no{ cursor:default; color:#8a8079; font-size:13px; }
    .mres.no:hover{ background:none; }
    @media (max-width:640px){
      #topbar{ flex-direction:column; align-items:flex-start; gap:6px; padding:10px 14px; }
      #topbar .clockwrap{ display:none; }
      #legend{ font-size:11px; padding:10px 12px; }
      #searchWrap{ width:100%; max-width:none; flex-basis:auto; }
    }
  </style>
  <script src="adn-ui.js" defer></script>
</head>
<body>
  <div id="map"></div>

  <div id="topbar" class="glass">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <div style="height:42px;width:42px;border-radius:12px;display:grid;place-items:center;background:rgba(181,115,79,.15);border:1px solid rgba(196,140,100,.3);flex:0 0 auto"><i data-lucide="map" class="metric-icon" style="width:24px;height:24px;color:var(--copper)"></i></div>
      <div style="min-width:0">
        <p style="margin:0;font-size:19px;font-weight:800;line-height:1.05;display:flex;align-items:center;gap:8px">Mapa Minero de Chile <span class="fi fi-cl" style="font-size:.8em;border-radius:3px"></span></p>
        <p style="margin:2px 0 0;font-size:11px;color:#c9b7a5">ADN Minero · faenas, trabajos y servicios de la minería</p>
      </div>
    </div>
    <div id="searchWrap">
      <div id="searchBox">
        <i data-lucide="search"></i>
        <input id="mapq" type="search" inputmode="search" autocomplete="off" placeholder="Buscar faena, empresa, puerto…" aria-label="Buscar en el mapa">
        <button id="mapqx" type="button" aria-label="Limpiar" hidden>✕</button>
      </div>
      <div id="mapres" class="glass" role="listbox"></div>
    </div>
    <div class="clockwrap" style="text-align:right;flex:0 0 auto">
      <p id="clock" style="margin:0;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1">--:--</p>
      <p style="margin:2px 0 0;font-size:10px;color:#c9b7a5">hora Chile</p>
    </div>
  </div>

  <div id="legend" class="glass">
    <h4>Filtrar por mineral / servicios</h4>
    <div id="legendRows"></div>
  </div>

  <div id="count" class="glass"><span id="countTxt">—</span></div>

<script src="regiones-cl.js"></script>
<script>
  const TZ='America/Santiago';
  const gmaps=(lat,lon)=>'https://www.google.com/maps/search/?api=1&query='+lat+','+lon;
  const gmapsLink=(lat,lon)=>`<div style="margin-top:6px"><a class="src" href="${gmaps(lat,lon)}" target="_blank" rel="noopener">📍 Ver en Google Maps →</a></div>`;
  const MIN={
    cobre:  {label:'Cobre',  color:'#cf9b6f'},
    oro:    {label:'Oro',    color:'#f5c542'},
    hierro: {label:'Hierro', color:'#e0715a'},
    litio:  {label:'Litio',  color:'#5fd1bd'},
    plata:  {label:'Plata',  color:'#c7d2e0'}
  };
  const FAENAS=[
    {n:'Escondida', e:'BHP', m:'cobre', r:'Antofagasta', lat:-24.27, lon:-69.07},
    {n:'Collahuasi', e:'Collahuasi', m:'cobre', r:'Tarapacá', lat:-20.98, lon:-68.68},
    {n:'Chuquicamata', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.29, lon:-68.90},
    {n:'Radomiro Tomic', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.28, lon:-68.92},
    {n:'Ministro Hales', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.05, lon:-68.92},
    {n:'Gabriela Mistral', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-24.30, lon:-69.20},
    {n:'El Teniente', e:'Codelco', m:'cobre', r:"O'Higgins", lat:-34.08, lon:-70.36},
    {n:'Andina', e:'Codelco', m:'cobre', r:'Valparaíso', lat:-33.05, lon:-70.28},
    {n:'Salvador', e:'Codelco', m:'cobre', r:'Atacama', lat:-26.25, lon:-69.62},
    {n:'Los Bronces', e:'Anglo American', m:'cobre', r:'Metropolitana', lat:-33.14, lon:-70.28},
    {n:'El Soldado', e:'Anglo American', m:'cobre', r:'Valparaíso', lat:-32.66, lon:-71.00},
    {n:'Spence', e:'BHP', m:'cobre', r:'Antofagasta', lat:-22.75, lon:-69.28},
    {n:'Centinela', e:'Antofagasta Minerals', m:'cobre', r:'Antofagasta', lat:-23.05, lon:-69.02},
    {n:'Antucoya', e:'Antofagasta Minerals', m:'cobre', r:'Antofagasta', lat:-22.35, lon:-69.90},
    {n:'Los Pelambres', e:'Antofagasta Minerals', m:'cobre', r:'Coquimbo', lat:-31.75, lon:-70.49},
    {n:'Zaldívar', e:'Antofagasta Minerals / Barrick', m:'cobre', r:'Antofagasta', lat:-24.20, lon:-69.05},
    {n:'Candelaria', e:'Lundin Mining', m:'cobre', r:'Atacama', lat:-27.51, lon:-70.28},
    {n:'Caserones', e:'Lundin Mining', m:'cobre', r:'Atacama', lat:-28.00, lon:-69.70},
    {n:'El Abra', e:'Freeport / Codelco', m:'cobre', r:'Antofagasta', lat:-21.75, lon:-68.77},
    {n:'Quebrada Blanca', e:'Teck', m:'cobre', r:'Tarapacá', lat:-20.99, lon:-68.75},
    {n:'Sierra Gorda', e:'South32 / KGHM', m:'cobre', r:'Antofagasta', lat:-22.90, lon:-69.30},
    {n:'Mantoverde', e:'Capstone', m:'cobre', r:'Atacama', lat:-27.00, lon:-70.70},
    {n:'Lomas Bayas', e:'Glencore', m:'cobre', r:'Antofagasta', lat:-22.90, lon:-69.50},
    {n:'Mantos Blancos', e:'Capstone', m:'cobre', r:'Antofagasta', lat:-23.52, lon:-70.13},
    {n:'El Peñón', e:'Yamana / Pan American', m:'oro', r:'Antofagasta', lat:-24.40, lon:-69.35},
    {n:'La Coipa', e:'Kinross', m:'oro', r:'Atacama', lat:-26.78, lon:-69.28},
    {n:'Maricunga', e:'Maricunga', m:'oro', r:'Atacama', lat:-27.13, lon:-69.05},
    {n:'Los Colorados', e:'CAP Minería', m:'hierro', r:'Atacama', lat:-28.30, lon:-70.60},
    {n:'El Romeral', e:'CAP Minería', m:'hierro', r:'Coquimbo', lat:-29.70, lon:-71.28},
    {n:'Salar de Atacama', e:'SQM / Albemarle', m:'litio', r:'Antofagasta', lat:-23.50, lon:-68.20}
  ];

  const map=L.map('map',{ zoomControl:true, attributionControl:true }).setView([-27.5,-70.2], 5);
  // Basemap oscuro sin API key (Esri Dark Gray: base + etiquetas)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors', maxNativeZoom:16, maxZoom:19
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{
    maxNativeZoom:16, maxZoom:19
  }).addTo(map);

  // ===== Contorno de las regiones de Chile (dibujo decorativo) =====
  let regionesLayer=null, regionesOn=true;
  const RG_BASE={ color:'#cf9b6f', weight:1, opacity:.45, fillColor:'#cf9b6f', fillOpacity:.05 };
  const RG_HOVER={ color:'#f0d7b6', weight:1.8, opacity:.85, fillColor:'#cf9b6f', fillOpacity:.14 };
  if(window.REGIONES_CL){
    regionesLayer=L.geoJSON(window.REGIONES_CL,{
      style:()=>RG_BASE,
      onEachFeature:(feat,lyr)=>{
        if(feat.properties&&feat.properties.n) lyr.bindTooltip(feat.properties.n,{sticky:true,className:'region-tip'});
        lyr.on('mouseover',()=>lyr.setStyle(RG_HOVER));
        lyr.on('mouseout',()=>lyr.setStyle(RG_BASE));
      }
    }).addTo(map);
  }

  // Etiquetas fijas con el nombre de cada región
  let labelsLayer=null;
  function bboxArea(r){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const p of r){ if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1]; } return (c-a)*(d-b); }
  function centroid(feat){
    const g=feat.geometry;
    const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
    let best=null, bestA=-1;
    for(const poly of polys){ const r=poly[0]; const ar=bboxArea(r); if(ar>bestA){ bestA=ar; best=r; } }
    let sx=0, sy=0; for(const p of best){ sx+=p[0]; sy+=p[1]; }
    return [sy/best.length, sx/best.length]; // [lat, lon]
  }
  function shortName(n){
    let s=n.replace(/^Regi[oó]n\s+(del\s+|de\s+)?/i,'');
    s=s.replace(/^Metropolitana de Santiago$/i,'Metropolitana');
    s=s.replace(/\s+del\s+Gral.*$/i,'');
    s=s.replace(/\s+y\s+Ant[aá]rtica.*$/i,'');
    s=s.replace(/^Libertador\s+Bernardo\s+/i,'');
    return s;
  }
  if(regionesLayer){
    labelsLayer=L.layerGroup();
    window.REGIONES_CL.features.forEach(f=>{
      const [lat,lon]=centroid(f);
      const ic=L.divIcon({className:'region-label', html:shortName(f.properties.n), iconSize:[0,0]});
      L.marker([lat,lon],{icon:ic, interactive:false, keyboard:false}).addTo(labelsLayer);
    });
    labelsLayer.addTo(map);
  }

  const active=new Set(Object.keys(MIN));
  const layers={};
  Object.keys(MIN).forEach(k=>layers[k]=L.layerGroup().addTo(map));

  // Portales de empleo por empresa (para el enlace "Trabaja aquí" en cada faena)
  const CAREERS=[
    { re:/Codelco/i,               url:'https://www.codelco.com/trabaja-en-codelco' },
    { re:/BHP/i,                   url:'https://www.bhp.com/es/careers/global-careers/careers-in-chile' },
    { re:/Collahuasi/i,            url:'https://www.collahuasi.cl/trabaja-con-nosotros/' },
    { re:/Anglo American/i,        url:'https://chile.angloamerican.com/es-es/empleo/opportunidades-laborales' },
    { re:/Antofagasta Minerals/i,  url:'https://www.aminerals.cl/trabaja-con-nosotros' }
  ];
  const careerFor=e=>{ const m=CAREERS.find(c=>c.re.test(e||'')); return m?m.url:null; };

  // ===== FICHA DE FAENA (clima en vivo + sismos) =====
  const $F=id=>document.getElementById(id);
  const drawI=()=>window.lucide&&lucide.createIcons();
  const MINIC={cobre:'coins',oro:'gem',hierro:'circle-dot',litio:'battery-charging',plata:'gem'};
  const havF=(a,b,c,d)=>{ const R=6371,r=Math.PI/180,dLat=(c-a)*r,dLon=(d-b)*r,x=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
  document.head.insertAdjacentHTML('beforeend', `<style>
    #ovF{position:fixed;inset:0;z-index:3000;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(10,8,7,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    #ovF.on{display:block;animation:ovFin .25s ease both} @keyframes ovFin{from{opacity:0}to{opacity:1}}
    #ovF *{box-sizing:border-box}
    #ovF .sheet{max-width:560px;margin:0 auto;min-height:100%;padding:16px 16px 40px;color:#f4ece5;font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
    #ovF .panel{animation:ovFup .3s cubic-bezier(.2,.7,.3,1) both} @keyframes ovFup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    #ovFclose{position:sticky;top:8px;margin-left:auto;display:grid;place-items:center;width:42px;height:42px;border-radius:999px;cursor:pointer;background:linear-gradient(160deg,rgba(48,41,35,.95),rgba(28,23,19,.9));border:1px solid rgba(196,168,148,.25);color:#e8c9a6;box-shadow:0 6px 18px rgba(0,0,0,.5)}
    #ovF .fhead{text-align:center}
    #ovF .ficon{display:grid;place-items:center;height:64px;width:64px;border-radius:18px;margin:0 auto}
    #ovF h2{font-size:26px;font-weight:800;margin:12px 0 0}
    #ovF .badges{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:#c9b7a5}
    #ovF .badges .mb{padding:4px 11px;border-radius:999px;font-weight:800}
    #ovF .fglass{background:linear-gradient(160deg,rgba(43,37,32,.92),rgba(26,21,18,.82));border:1px solid rgba(196,168,148,.16);border-radius:16px;padding:16px;margin-top:16px}
    #ovF .sec-h{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:#e8ddd2;margin:0}
    #ovF .fclima{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    @media(max-width:520px){#ovF .fclima{grid-template-columns:repeat(2,1fr)}}
    #ovF .tile{border-radius:12px;padding:12px 8px;text-align:center}
    #ovF .tile i{display:block;margin:0 auto}
    #ovF .tile .v{font-size:22px;font-weight:800;margin:4px 0 0}
    #ovF .tile .l{font-size:11px;color:#a99e92;margin-top:2px}
    #ovF .slist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
    #ovF .srow{display:flex;align-items:center;gap:12px;border-radius:12px;padding:8px 12px}
    #ovF .srow .sm{font-size:20px;font-weight:800;min-width:44px}
    #ovF .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
    #ovF .btn{border-radius:12px;padding:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;border:0;width:100%;font-family:inherit;font-size:15px}
    #ovF .btn:active{transform:scale(.97)}
    #ovF .sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));background-size:200% 100%;animation:shF 1.4s infinite;border-radius:10px}
    @keyframes shF{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>`);
  document.body.insertAdjacentHTML('beforeend','<div id="ovF"><div class="sheet"><button id="ovFclose" aria-label="Cerrar"><i data-lucide="x" style="width:22px;height:22px"></i></button><div id="ovFp" class="panel"></div></div></div>');

  function openFaena(f){
    const c=MIN[f.m].color, job=careerFor(f.e);
    const box=(ic,val,lab,col)=>`<div class="tile" style="background:${col}14;border:1px solid ${col}2e"><i data-lucide="${ic}" style="width:22px;height:22px;color:${col}"></i><p class="v">${val}</p><p class="l">${lab}</p></div>`;
    $F('ovFp').innerHTML=`
      <div class="fhead">
        <div class="ficon" style="background:${c}1e;border:1px solid ${c}4d"><i data-lucide="${MINIC[f.m]||'pickaxe'}" style="width:30px;height:30px;color:${c}"></i></div>
        <h2>${f.n}</h2>
        <div class="badges">
          <span class="mb" style="color:${c};background:${c}22;border:1px solid ${c}55">${MIN[f.m].label}</span>
          <span>🏢 ${f.e}</span><span>📍 Región de ${f.r}</span>
        </div>
      </div>
      <div class="fglass">
        <p class="sec-h"><i data-lucide="cloud-sun" style="width:16px;height:16px;color:#7fbfd1"></i> Clima ahora</p>
        <div id="fClima" class="fclima"><div class="sk" style="height:80px"></div><div class="sk" style="height:80px"></div><div class="sk" style="height:80px"></div><div class="sk" style="height:80px"></div></div>
      </div>
      <div class="fglass">
        <p class="sec-h"><i data-lucide="activity" style="width:16px;height:16px;color:#e05a3f"></i> Sismos cercanos <span style="font-size:11px;font-weight:400;color:#8a8079">· 7 días · &lt;250 km</span></p>
        <div id="fSismos" class="slist"><div class="sk" style="height:46px"></div><div class="sk" style="height:46px"></div></div>
      </div>
      <div class="acts">
        <a href="${gmaps(f.lat,f.lon)}" target="_blank" rel="noopener" class="btn" style="background:#cf9b6f1e;border:1px solid #cf9b6f4d;color:#e8c9a6"><i data-lucide="map-pin" style="width:18px;height:18px"></i> Ver en Google Maps</a>

      </div>`;
    $F('ovF').classList.add('on'); document.body.style.overflow='hidden'; $F('ovF').scrollTop=0; drawI();

    fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=${start}&minmagnitude=3&minlatitude=${f.lat-3}&maxlatitude=${f.lat+3}&minlongitude=${f.lon-3}&maxlongitude=${f.lon+3}`)

        el.innerHTML=list.map(x=>{ const col=x.m>=5?'#e05a3f':x.m>=4?'#e0a35a':'#a7d18a', h=Math.round((Date.now()-x.t)/36e5); return `<div class="srow" style="background:${col}12;border:1px solid ${col}2e"><span class="sm" style="color:${col}">${x.m.toFixed(1)}</span><div style="font-size:13px"><p style="font-weight:600;margin:0">a ${Math.round(x.d)} km</p><p style="font-size:11px;color:#a99e92;margin:0">${h<24?'hace '+h+' h':'hace '+Math.round(h/24)+' d'}</p></div></div>`; }).join(''); drawI(); })

  const mapq=$F('mapq'), mapres=$F('mapres'), mapqx=$F('mapqx');
  let results=[], sel=-1;
  function hideRes(){ mapres.classList.remove('on'); sel=-1; }
  function ensureLayer(it){
    if(it.type==='faena'){ if(!active.has(it.key)){ active.add(it.key); layers[it.key].addTo(map); const el=rows.querySelector('.lg-row[data-k="'+it.key+'"]'); if(el) el.classList.remove('off'); refreshCount(); } }

    else if(it.type==='port'){ if(!puertosOn){ puertosOn=true; puertosLayer.addTo(map); puRow.classList.remove('off'); refreshCount(); } }
    else if(it.type==='edu'){ if(!eduOn){ eduOn=true; eduLayer.addTo(map); edRow.classList.remove('off'); refreshCount(); } }
  }
  function focusMap(it){
    hideRes(); mapq.blur(); ensureLayer(it);
    map.flyTo([it.lat,it.lon], Math.max(map.getZoom(),9), {duration:.7});
    if(it.type==='faena'){ openFaena(it.f); }
    else if(it.mk){ const mk=it.mk; map.once('moveend',()=>{ try{mk.openPopup();}catch(e){} }); setTimeout(()=>{ try{mk.openPopup();}catch(e){} },900); }
  }
  function renderRes(){
    if(!results.length){ mapres.innerHTML='<div class="mres no">Sin resultados. Prueba con otra faena, empresa o región.</div>'; mapres.classList.add('on'); return; }
    mapres.innerHTML=results.map((it,i)=>`<div class="mres${i===sel?' sel':''}" data-i="${i}"><span class="ic">${it.ic}</span><span class="tt"><b>${it.n}</b><span>${it.sub}</span></span></div>`).join('');
    mapres.classList.add('on');
  }
  function doSearch(){
    mapqx.hidden=!mapq.value;
    const q=norm(mapq.value.trim());
    if(!q){ results=[]; hideRes(); return; }
    results=SEARCH_INDEX.filter(it=>it._s.includes(q))
      .sort((a,b)=>(norm(a.n).startsWith(q)?0:1)-(norm(b.n).startsWith(q)?0:1))
      .slice(0,12);
    sel=-1; renderRes();
  }
  mapq.addEventListener('input', doSearch);
  mapq.addEventListener('focus', ()=>{ if(mapq.value) doSearch(); });
  mapq.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(results.length){ sel=(sel+1)%results.length; renderRes(); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(results.length){ sel=(sel-1+results.length)%results.length; renderRes(); } }
    else if(e.key==='Enter'){ e.preventDefault(); const it=results[sel>=0?sel:0]; if(it) focusMap(it); }
    else if(e.key==='Escape'){ mapq.value=''; results=[]; hideRes(); mapqx.hidden=true; }
  });
  mapres.addEventListener('click', e=>{ const r=e.target.closest('.mres[data-i]'); if(!r) return; const it=results[+r.dataset.i]; if(it) focusMap(it); });
  mapqx.addEventListener('click', ()=>{ mapq.value=''; results=[]; hideRes(); mapqx.hidden=true; mapq.focus(); });
  document.addEventListener('click', e=>{ if(!e.target.closest('#searchWrap')) hideRes(); });

  function tick(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}); }
  tick(); setInterval(tick,1000);
  window.lucide && lucide.createIcons();
</script>
</body>
</html>
