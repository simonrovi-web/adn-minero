<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADN Minero · Mapa Minero de Chile</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    :root{ --copper:#cf9b6f; }
    *{box-sizing:border-box}
    html,body{ height:100%; margin:0; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; background:#141110; color:#f4ece5; overflow:hidden; }
    #map{ position:fixed; inset:0; z-index:0; background:#141110; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.82), rgba(26,21,18,0.72)); backdrop-filter:blur(14px) saturate(130%); -webkit-backdrop-filter:blur(14px) saturate(130%); border:1px solid rgba(196,168,148,0.16); box-shadow:0 8px 30px rgba(0,0,0,0.5); }
    #topbar{ position:fixed; top:14px; left:14px; right:14px; z-index:1000; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:16px; padding:10px 16px; pointer-events:auto; }
    #legend{ position:fixed; left:14px; bottom:14px; z-index:1000; border-radius:14px; padding:12px 14px; font-size:12px; }
    #legend h4{ margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#c9b7a5; font-weight:700; }
    .lg-row{ display:flex; align-items:center; gap:8px; margin:5px 0; cursor:pointer; user-select:none; opacity:.95; }
    .lg-row.off{ opacity:.35; }
    .lg-dot{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 6px currentColor; border:2px solid rgba(255,255,255,.85); }
    .count{ position:fixed; right:14px; bottom:14px; z-index:1000; border-radius:12px; padding:8px 12px; font-size:12px; color:#e6d4c4; }
    .metric-icon{ filter:drop-shadow(0 0 8px currentColor); }
    .leaflet-popup-content-wrapper{ background:#241d18; color:#f4ece5; border-radius:14px; border:1px solid rgba(196,168,148,.22); box-shadow:0 10px 34px rgba(0,0,0,.6); }
    .leaflet-popup-tip{ background:#241d18; border:1px solid rgba(196,168,148,.22); }
    .leaflet-popup-content{ margin:12px 14px; font-size:13px; line-height:1.5; }
    .leaflet-container a.leaflet-popup-close-button{ color:#c9b7a5; }
    .pop-t{ font-size:15px; font-weight:800; margin-bottom:2px; }
    .pop-m{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:999px; margin-top:6px; }
    .pop-r{ color:#c9b7a5; font-size:12px; margin-top:4px; display:flex; align-items:center; gap:5px; }
    .leaflet-bar a{ background:#2b2520; color:#e6d4c4; border-color:rgba(196,168,148,.2); }
    .leaflet-bar a:hover{ background:#3a3129; }
    .leaflet-tooltip.region-tip{ background:#241d18; color:#f0e2d3; border:1px solid rgba(196,168,148,.32); box-shadow:0 6px 20px rgba(0,0,0,.5); font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; }
    .leaflet-tooltip.region-tip::before{ display:none; }
    .region-label{ color:#efd9bd; font-size:10px; font-weight:700; letter-spacing:.02em; white-space:nowrap; text-shadow:0 1px 3px #000, 0 0 6px #000, 0 0 2px #000; pointer-events:none; transform:translate(-50%,-50%); opacity:.9; }
    @media (max-width:640px){
      #topbar{ flex-direction:column; align-items:flex-start; gap:6px; padding:10px 14px; }
      #topbar .clockwrap{ display:none; }
      #legend{ font-size:11px; padding:10px 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar" class="glass">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <div style="height:42px;width:42px;border-radius:12px;display:grid;place-items:center;background:rgba(181,115,79,.15);border:1px solid rgba(196,140,100,.3);flex:0 0 auto"><i data-lucide="map" class="metric-icon" style="width:24px;height:24px;color:var(--copper)"></i></div>
      <div style="min-width:0">
        <p style="margin:0;font-size:19px;font-weight:800;line-height:1.05;display:flex;align-items:center;gap:8px">Mapa Minero de Chile <span class="fi fi-cl" style="font-size:.8em;border-radius:3px"></span></p>
        <p style="margin:2px 0 0;font-size:11px;color:#c9b7a5">ADN Minero · faenas, trabajos y servicios de la minería</p>
      </div>
    </div>
    <div class="clockwrap" style="text-align:right;flex:0 0 auto">
      <p id="clock" style="margin:0;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1">--:--</p>
      <p style="margin:2px 0 0;font-size:10px;color:#c9b7a5">hora Chile</p>
    </div>
  </div>

  <div id="legend" class="glass">
    <h4>Filtrar por mineral / servicios</h4>
    <div id="legendRows"></div>
  </div>

  <div id="count" class="glass"><span id="countTxt">—</span></div>

<script src="regiones-cl.js"></script>
<script>
  const TZ='America/Santiago';
  const gmaps=(lat,lon)=>'https://www.google.com/maps/search/?api=1&query='+lat+','+lon;
  const gmapsLink=(lat,lon)=>`<div style="margin-top:6px"><a class="src" href="${gmaps(lat,lon)}" target="_blank" rel="noopener">📍 Ver en Google Maps →</a></div>`;
  const MIN={
    cobre:  {label:'Cobre',  color:'#cf9b6f'},
    oro:    {label:'Oro',    color:'#f5c542'},
    hierro: {label:'Hierro', color:'#e0715a'},
    litio:  {label:'Litio',  color:'#5fd1bd'},
    plata:  {label:'Plata',  color:'#c7d2e0'}
  };
  const FAENAS=[
    {n:'Escondida', e:'BHP', m:'cobre', r:'Antofagasta', lat:-24.27, lon:-69.07},
    {n:'Collahuasi', e:'Collahuasi', m:'cobre', r:'Tarapacá', lat:-20.98, lon:-68.68},
    {n:'Chuquicamata', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.29, lon:-68.90},
    {n:'Radomiro Tomic', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.28, lon:-68.92},
    {n:'Ministro Hales', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-22.05, lon:-68.92},
    {n:'Gabriela Mistral', e:'Codelco', m:'cobre', r:'Antofagasta', lat:-24.30, lon:-69.20},
    {n:'El Teniente', e:'Codelco', m:'cobre', r:"O'Higgins", lat:-34.08, lon:-70.36},
    {n:'Andina', e:'Codelco', m:'cobre', r:'Valparaíso', lat:-33.05, lon:-70.28},
    {n:'Salvador', e:'Codelco', m:'cobre', r:'Atacama', lat:-26.25, lon:-69.62},
    {n:'Los Bronces', e:'Anglo American', m:'cobre', r:'Metropolitana', lat:-33.14, lon:-70.28},
    {n:'El Soldado', e:'Anglo American', m:'cobre', r:'Valparaíso', lat:-32.66, lon:-71.00},
    {n:'Spence', e:'BHP', m:'cobre', r:'Antofagasta', lat:-22.75, lon:-69.28},
    {n:'Centinela', e:'Antofagasta Minerals', m:'cobre', r:'Antofagasta', lat:-23.05, lon:-69.02},
    {n:'Antucoya', e:'Antofagasta Minerals', m:'cobre', r:'Antofagasta', lat:-22.35, lon:-69.90},
    {n:'Los Pelambres', e:'Antofagasta Minerals', m:'cobre', r:'Coquimbo', lat:-31.75, lon:-70.49},
    {n:'Zaldívar', e:'Antofagasta Minerals / Barrick', m:'cobre', r:'Antofagasta', lat:-24.20, lon:-69.05},
    {n:'Candelaria', e:'Lundin Mining', m:'cobre', r:'Atacama', lat:-27.51, lon:-70.28},
    {n:'Caserones', e:'Lundin Mining', m:'cobre', r:'Atacama', lat:-28.00, lon:-69.70},
    {n:'El Abra', e:'Freeport / Codelco', m:'cobre', r:'Antofagasta', lat:-21.75, lon:-68.77},
    {n:'Quebrada Blanca', e:'Teck', m:'cobre', r:'Tarapacá', lat:-20.99, lon:-68.75},
    {n:'Sierra Gorda', e:'South32 / KGHM', m:'cobre', r:'Antofagasta', lat:-22.90, lon:-69.30},
    {n:'Mantoverde', e:'Capstone', m:'cobre', r:'Atacama', lat:-27.00, lon:-70.70},
    {n:'Lomas Bayas', e:'Glencore', m:'cobre', r:'Antofagasta', lat:-22.90, lon:-69.50},
    {n:'Mantos Blancos', e:'Capstone', m:'cobre', r:'Antofagasta', lat:-23.52, lon:-70.13},
    {n:'El Peñón', e:'Yamana / Pan American', m:'oro', r:'Antofagasta', lat:-24.40, lon:-69.35},
    {n:'La Coipa', e:'Kinross', m:'oro', r:'Atacama', lat:-26.78, lon:-69.28},
    {n:'Maricunga', e:'Maricunga', m:'oro', r:'Atacama', lat:-27.13, lon:-69.05},
    {n:'Los Colorados', e:'CAP Minería', m:'hierro', r:'Atacama', lat:-28.30, lon:-70.60},
    {n:'El Romeral', e:'CAP Minería', m:'hierro', r:'Coquimbo', lat:-29.70, lon:-71.28},
    {n:'Salar de Atacama', e:'SQM / Albemarle', m:'litio', r:'Antofagasta', lat:-23.50, lon:-68.20}
  ];

  const map=L.map('map',{ zoomControl:true, attributionControl:true }).setView([-27.5,-70.2], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(map);

  // ===== Contorno de las regiones de Chile (dibujo decorativo) =====
  let regionesLayer=null, regionesOn=true;
  const RG_BASE={ color:'#cf9b6f', weight:1, opacity:.45, fillColor:'#cf9b6f', fillOpacity:.05 };
  const RG_HOVER={ color:'#f0d7b6', weight:1.8, opacity:.85, fillColor:'#cf9b6f', fillOpacity:.14 };
  if(window.REGIONES_CL){
    regionesLayer=L.geoJSON(window.REGIONES_CL,{
      style:()=>RG_BASE,
      onEachFeature:(feat,lyr)=>{
        if(feat.properties&&feat.properties.n) lyr.bindTooltip(feat.properties.n,{sticky:true,className:'region-tip'});
        lyr.on('mouseover',()=>lyr.setStyle(RG_HOVER));
        lyr.on('mouseout',()=>lyr.setStyle(RG_BASE));
      }
    }).addTo(map);
  }

  // Etiquetas fijas con el nombre de cada región
  let labelsLayer=null;
  function bboxArea(r){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const p of r){ if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1]; } return (c-a)*(d-b); }
  function centroid(feat){
    const g=feat.geometry;
    const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
    let best=null, bestA=-1;
    for(const poly of polys){ const r=poly[0]; const ar=bboxArea(r); if(ar>bestA){ bestA=ar; best=r; } }
    let sx=0, sy=0; for(const p of best){ sx+=p[0]; sy+=p[1]; }
    return [sy/best.length, sx/best.length]; // [lat, lon]
  }
  function shortName(n){
    let s=n.replace(/^Regi[oó]n\s+(del\s+|de\s+)?/i,'');
    s=s.replace(/^Metropolitana de Santiago$/i,'Metropolitana');
    s=s.replace(/\s+del\s+Gral.*$/i,'');
    s=s.replace(/\s+y\s+Ant[aá]rtica.*$/i,'');
    s=s.replace(/^Libertador\s+Bernardo\s+/i,'');
    return s;
  }
  if(regionesLayer){
    labelsLayer=L.layerGroup();
    window.REGIONES_CL.features.forEach(f=>{
      const [lat,lon]=centroid(f);
      const ic=L.divIcon({className:'region-label', html:shortName(f.properties.n), iconSize:[0,0]});
      L.marker([lat,lon],{icon:ic, interactive:false, keyboard:false}).addTo(labelsLayer);
    });
    labelsLayer.addTo(map);
  }

  const active=new Set(Object.keys(MIN));
  const layers={};
  Object.keys(MIN).forEach(k=>layers[k]=L.layerGroup().addTo(map));

  // Portales de empleo por empresa (para el enlace "Trabaja aquí" en cada faena)
  const CAREERS=[
    { re:/Codelco/i,               url:'https://www.codelco.com/trabaja-en-codelco' },
    { re:/BHP/i,                   url:'https://www.bhp.com/es/careers/global-careers/careers-in-chile' },
    { re:/Collahuasi/i,            url:'https://www.collahuasi.cl/trabaja-con-nosotros/' },
    { re:/Anglo American/i,        url:'https://chile.angloamerican.com/es-es/empleo/opportunidades-laborales' },
    { re:/Antofagasta Minerals/i,  url:'https://www.aminerals.cl/trabaja-con-nosotros' }
  ];
  const careerFor=e=>{ const m=CAREERS.find(c=>c.re.test(e||'')); return m?m.url:null; };

  function marker(f){
    const c=MIN[f.m].color;
    const ic=L.divIcon({className:'', html:`<span style="display:block;width:15px;height:15px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 8px ${c},0 1px 4px rgba(0,0,0,.6)"></span>`, iconSize:[15,15], iconAnchor:[7,7]});
    const mk=L.marker([f.lat,f.lon],{icon:ic});
    const job=careerFor(f.e);
    mk.bindPopup(`<div class="pop-t">${f.n}</div>
      <div class="pop-r"><span>🏢</span> ${f.e}</div>
      <div class="pop-r"><span>📍</span> Región de ${f.r}</div>
      <span class="pop-m" style="color:${c};background:${c}22;border:1px solid ${c}55">${MIN[f.m].label}</span>
      ${job?`<div style="margin-top:8px"><a class="src" href="${job}" target="_blank" rel="noopener">👷 Trabaja aquí · postular →</a></div>`:''}
      ${gmapsLink(f.lat,f.lon)}`);
    return mk;
  }
  FAENAS.forEach(f=>{ if(MIN[f.m]) marker(f).addTo(layers[f.m]); });

  // ===== Capa de SERVICIOS / PROVEEDORES (empresas que prestan servicios a la minería) =====
  const SERV_COLOR='#67c1d6';
  const SERVICIOS=[
    {n:'Finning (arriendo CAT)', cat:'Arriendo de equipos',   r:'Antofagasta', lat:-23.652, lon:-70.398, link:'https://www.finning.com/es_CL/services/rental.html'},
    {n:'Komatsu Chile',          cat:'Arriendo de equipos',   r:'Antofagasta', lat:-23.673, lon:-70.395, link:'https://www.komatsulatinoamerica.com/chile/arriendo/'},
    {n:'Epiroc Chile',           cat:'Perforación',           r:'Calama',      lat:-22.456, lon:-68.929, link:'https://www.epiroc.com/es-cl'},
    {n:'Enaex',                  cat:'Explosivos y tronadura',r:'Mejillones',  lat:-23.099, lon:-70.449, link:'https://www.enaex.com/cl/es/servicios-a-cielo-abierto/'},
    {n:'Rinco',                  cat:'Arriendo de maquinaria',r:'Santiago',    lat:-33.365, lon:-70.730, link:'http://www.rinco.cl/'},
    {n:'Minero Markets',         cat:'Maquinaria minera',     r:'Santiago',    lat:-33.450, lon:-70.655, link:'https://mineromarkets.cl/'},
    {n:'Aggreko',                cat:'Energía (arriendo)',    r:'Santiago',    lat:-33.440, lon:-70.780, link:'https://www.aggreko.com/es-cl/sectors/mining'},
    {n:'Metso',                  cat:'Procesamiento / plantas',r:'Antofagasta',lat:-23.660, lon:-70.392, link:'https://www.metso.com/'},
    {n:'Liebherr Chile',         cat:'Equipos mineros / grúas',r:'Santiago',   lat:-33.402, lon:-70.582, link:'https://www.liebherr.com/es-cl/'}
  ];
  const serviciosLayer=L.layerGroup().addTo(map);
  let serviciosOn=true;
  function servMarker(s){
    const c=SERV_COLOR;
    const ic=L.divIcon({className:'', html:`<span style="display:block;width:15px;height:15px;border-radius:4px;background:${c};border:2px solid #fff;box-shadow:0 0 8px ${c},0 1px 4px rgba(0,0,0,.6)"></span>`, iconSize:[15,15], iconAnchor:[7,7]});
    const mk=L.marker([s.lat,s.lon],{icon:ic});
    mk.bindPopup(`<div class="pop-t">🔧 ${s.n}</div>
      <div class="pop-r"><span>🧰</span> ${s.cat}</div>
      <div class="pop-r"><span>📍</span> ${s.r} · cobertura nacional (referencial)</div>
      <span class="pop-m" style="color:${c};background:${c}22;border:1px solid ${c}55">Servicio</span>
      <div style="margin-top:8px"><a class="src" href="${s.link}" target="_blank" rel="noopener">Ver servicios / Contactar →</a></div>
      ${gmapsLink(s.lat,s.lon)}`);
    return mk;
  }
  SERVICIOS.forEach(s=>servMarker(s).addTo(serviciosLayer));

  // ===== Capa de PUERTOS MINEROS (embarque de concentrado, hierro, sales) =====
  const PORT_COLOR='#5fb3a1';
  const PUERTOS=[
    {n:'Puerto Angamos · Mejillones', r:'Antofagasta', carga:'Concentrado de cobre', lat:-23.100, lon:-70.443},
    {n:'Puerto de Antofagasta',        r:'Antofagasta', carga:'Carga minera general', lat:-23.650, lon:-70.400},
    {n:'Puerto Tocopilla',             r:'Antofagasta', carga:'Concentrado e insumos', lat:-22.090, lon:-70.200},
    {n:'Terminal Tal-Tal · Las Luces', r:'Antofagasta', carga:'Cobre', lat:-25.410, lon:-70.490},
    {n:'Puerto Patillos · Patache',    r:'Tarapacá',    carga:'Sales y yodo (SQM)', lat:-20.750, lon:-70.180},
    {n:'Puerto de Iquique',            r:'Tarapacá',    carga:'Carga minera general', lat:-20.210, lon:-70.152},
    {n:'Puerto Barquito · Chañaral',   r:'Atacama',     carga:'Cobre (El Salvador)', lat:-26.350, lon:-70.620},
    {n:'Puerto Caldera · Punta Padrones', r:'Atacama',  carga:'Concentrado (Candelaria)', lat:-27.060, lon:-70.820},
    {n:'Puerto Guacolda II · Huasco',  r:'Atacama',     carga:'Hierro (CAP)', lat:-28.470, lon:-71.220},
    {n:'Punta Chungo · Los Vilos',     r:'Coquimbo',    carga:'Concentrado (Los Pelambres)', lat:-31.920, lon:-71.510},
    {n:'Puerto de Coquimbo',           r:'Coquimbo',    carga:'Carga minera general', lat:-29.950, lon:-71.340},
    {n:'Puerto Ventanas',              r:'Valparaíso',  carga:'Cobre y graneles', lat:-32.750, lon:-71.480}
  ];
  const puertosLayer=L.layerGroup().addTo(map);
  let puertosOn=true;
  function portMarker(p){
    const c=PORT_COLOR;
    const ic=L.divIcon({className:'', html:`<span style="display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#0e2f2b;border:2px solid ${c};color:#a8e6d8;font-size:11px;box-shadow:0 0 8px ${c},0 1px 4px rgba(0,0,0,.6)">⚓</span>`, iconSize:[19,19], iconAnchor:[9,9]});
    const mk=L.marker([p.lat,p.lon],{icon:ic});
    mk.bindPopup(`<div class="pop-t">⚓ ${p.n}</div>
      <div class="pop-r"><span>📦</span> ${p.carga}</div>
      <div class="pop-r"><span>📍</span> Región de ${p.r}</div>
      <span class="pop-m" style="color:${c};background:${c}22;border:1px solid ${c}55">Puerto minero</span>
      <div style="margin-top:8px"><a class="src" href="adn-minero-mar.html" target="_blank" rel="noopener">Ver estado del mar →</a></div>
      ${gmapsLink(p.lat,p.lon)}`);
    return mk;
  }
  PUERTOS.forEach(p=>portMarker(p).addTo(puertosLayer));

  // ===== Capa de EDUCACIÓN (universidades e institutos con carreras mineras) =====
  const EDU_COLOR='#b98cd9';
  const EDUCACION=[
    {n:'Universidad de Chile', r:'Metropolitana', lat:-33.457, lon:-70.663, link:'https://ingenieria.uchile.cl/'},
    {n:'Pontificia U. Católica', r:'Metropolitana', lat:-33.499, lon:-70.614, link:'https://www.ing.uc.cl/'},
    {n:'Universidad de Santiago (USACH)', r:'Metropolitana', lat:-33.451, lon:-70.686, link:'https://www.usach.cl/'},
    {n:'AIEP', r:'Metropolitana', lat:-33.432, lon:-70.633, link:'https://www.aiep.cl/'},
    {n:'DUOC UC', r:'Metropolitana', lat:-33.447, lon:-70.647, link:'https://www.duoc.cl/'},
    {n:'U. Técnica F. Santa María', r:'Valparaíso', lat:-33.034, lon:-71.596, link:'https://www.usm.cl/'},
    {n:'Universidad de La Serena', r:'Coquimbo', lat:-29.909, lon:-71.252, link:'https://www.userena.cl/'},
    {n:'Universidad de Atacama', r:'Atacama', lat:-27.366, lon:-70.332, link:'https://www.uda.cl/'},
    {n:'Universidad Católica del Norte', r:'Antofagasta', lat:-23.685, lon:-70.412, link:'https://www.ucn.cl/'},
    {n:'Universidad de Antofagasta', r:'Antofagasta', lat:-23.632, lon:-70.394, link:'https://www.uantof.cl/'},
    {n:'INACAP (sede Antofagasta)', r:'Antofagasta', lat:-23.660, lon:-70.398, link:'https://www.inacap.cl/'},
    {n:'Santo Tomás (sede Antofagasta)', r:'Antofagasta', lat:-23.650, lon:-70.402, link:'https://www.santotomas.cl/'},
    {n:'Universidad de Concepción', r:'Biobío', lat:-36.829, lon:-73.036, link:'https://www.udec.cl/'}
  ];
  const eduLayer=L.layerGroup().addTo(map);
  let eduOn=true;
  function eduMarker(e){
    const c=EDU_COLOR;
    const ic=L.divIcon({className:'', html:`<span style="display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#2b1f3a;border:2px solid ${c};color:#e6d6f7;font-size:10px;box-shadow:0 0 8px ${c},0 1px 4px rgba(0,0,0,.6)">🎓</span>`, iconSize:[19,19], iconAnchor:[9,9]});
    const mk=L.marker([e.lat,e.lon],{icon:ic});
    mk.bindPopup(`<div class="pop-t">🎓 ${e.n}</div>
      <div class="pop-r"><span>📚</span> Carreras mineras</div>
      <div class="pop-r"><span>📍</span> Región ${e.r}</div>
      <span class="pop-m" style="color:${c};background:${c}22;border:1px solid ${c}55">Educación</span>
      <div style="margin-top:8px"><a class="src" href="${e.link}" target="_blank" rel="noopener">Ver institución →</a></div>
      <div style="margin-top:4px"><a class="src" href="adn-minero-educacion.html" target="_blank" rel="noopener">Ver carreras y becas →</a></div>
      ${gmapsLink(e.lat,e.lon)}`);
    return mk;
  }
  EDUCACION.forEach(e=>eduMarker(e).addTo(eduLayer));

  function refreshCount(){
    const total=FAENAS.filter(f=>active.has(f.m)).length;
    const sv=serviciosOn?SERVICIOS.length:0;
    const pu=puertosOn?PUERTOS.length:0;
    const ed=eduOn?EDUCACION.length:0;
    let extra=''; if(sv) extra+=` + ${sv} servicios`; if(pu) extra+=` + ${pu} puertos`; if(ed) extra+=` + ${ed} educación`;
    document.getElementById('countTxt').textContent=`${total} faenas${extra} en el mapa`;
  }

  // Leyenda / filtros
  const rows=document.getElementById('legendRows');
  Object.keys(MIN).forEach(k=>{
    const count=FAENAS.filter(f=>f.m===k).length;
    if(!count) return;
    const el=document.createElement('div');
    el.className='lg-row'; el.dataset.k=k;
    el.innerHTML=`<span class="lg-dot" style="color:${MIN[k].color};background:${MIN[k].color}"></span> ${MIN[k].label} <span style="color:#8a8079;margin-left:auto;padding-left:10px">${count}</span>`;
    el.addEventListener('click',()=>{
      if(active.has(k)){ active.delete(k); map.removeLayer(layers[k]); el.classList.add('off'); }
      else{ active.add(k); layers[k].addTo(map); el.classList.remove('off'); }
      refreshCount();
    });
    rows.appendChild(el);
  });

  // Separador + filtro de Servicios
  const sep=document.createElement('div'); sep.style.cssText='height:1px;background:rgba(196,168,148,.16);margin:9px 0 7px'; rows.appendChild(sep);
  const svRow=document.createElement('div');
  svRow.className='lg-row';
  svRow.innerHTML=`<span class="lg-dot" style="border-radius:3px;color:${SERV_COLOR};background:${SERV_COLOR}"></span> Servicios <span style="color:#8a8079;margin-left:auto;padding-left:10px">${SERVICIOS.length}</span>`;
  svRow.addEventListener('click',()=>{
    serviciosOn=!serviciosOn;
    if(serviciosOn){ serviciosLayer.addTo(map); svRow.classList.remove('off'); }
    else{ map.removeLayer(serviciosLayer); svRow.classList.add('off'); }
    refreshCount();
  });
  rows.appendChild(svRow);

  // Filtro de Puertos
  const puRow=document.createElement('div');
  puRow.className='lg-row';
  puRow.innerHTML=`<span class="lg-dot" style="display:grid;place-items:center;color:#0e2f2b;background:${PORT_COLOR};font-size:9px">⚓</span> Puertos <span style="color:#8a8079;margin-left:auto;padding-left:10px">${PUERTOS.length}</span>`;
  puRow.addEventListener('click',()=>{
    puertosOn=!puertosOn;
    if(puertosOn){ puertosLayer.addTo(map); puRow.classList.remove('off'); }
    else{ map.removeLayer(puertosLayer); puRow.classList.add('off'); }
    refreshCount();
  });
  rows.appendChild(puRow);

  // Filtro de Educación
  const edRow=document.createElement('div');
  edRow.className='lg-row';
  edRow.innerHTML=`<span class="lg-dot" style="display:grid;place-items:center;color:#2b1f3a;background:${EDU_COLOR};font-size:9px">🎓</span> Educación <span style="color:#8a8079;margin-left:auto;padding-left:10px">${EDUCACION.length}</span>`;
  edRow.addEventListener('click',()=>{
    eduOn=!eduOn;
    if(eduOn){ eduLayer.addTo(map); edRow.classList.remove('off'); }
    else{ map.removeLayer(eduLayer); edRow.classList.add('off'); }
    refreshCount();
  });
  rows.appendChild(edRow);

  // Toggle de Regiones (dibujo)
  if(regionesLayer){
    const rgRow=document.createElement('div');
    rgRow.className='lg-row';
    rgRow.innerHTML=`<span class="lg-dot" style="background:transparent;border:2px solid #cf9b6f;box-shadow:none"></span> Regiones <span style="color:#8a8079;margin-left:auto;padding-left:10px">16</span>`;
    rgRow.addEventListener('click',()=>{
      regionesOn=!regionesOn;
      if(regionesOn){ regionesLayer.addTo(map); if(labelsLayer) labelsLayer.addTo(map); rgRow.classList.remove('off'); }
      else{ map.removeLayer(regionesLayer); if(labelsLayer) map.removeLayer(labelsLayer); rgRow.classList.add('off'); }
    });
    rows.appendChild(rgRow);
  }

  // Enlace al panel completo de Trabajos y Servicios
  const link=document.createElement('a');
  link.href='adn-minero-empleos.html';
  link.style.cssText='display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:#e8c9a6;text-decoration:none';
  link.innerHTML='<i data-lucide="briefcase" style="width:13px;height:13px"></i> Ver Trabajos y Servicios →';
  rows.appendChild(link);

  // Portales de empleo online (sin ubicación física)
  const PORTALES=[
    {n:'Computrabajo', url:'https://cl.computrabajo.com/trabajo-de-minera'},
    {n:'Indeed', url:'https://cl.indeed.com/q-mineria-empleos.html'},
    {n:'Trabajos en Minera', url:'https://trabajosenminera.com/'}
  ];
  const pWrap=document.createElement('div');
  pWrap.style.cssText='margin-top:10px;padding-top:8px;border-top:1px solid rgba(196,168,148,.16)';
  pWrap.innerHTML='<div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8a8079;margin-bottom:5px;display:flex;align-items:center;gap:5px"><i data-lucide="globe" style="width:12px;height:12px"></i> Portales de empleo (online)</div>'+
    PORTALES.map(p=>`<a href="${p.url}" target="_blank" rel="noopener" style="display:block;font-size:11px;color:#c9b7a5;text-decoration:none;padding:2px 0">• ${p.n} ↗</a>`).join('');
  rows.appendChild(pWrap);

  refreshCount();

  function tick(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}); }
  tick(); setInterval(tick,1000);
  window.lucide && lucide.createIcons();
</script>
</body>
</html>
