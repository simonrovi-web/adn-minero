<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141110" />
  <meta name="robots" content="noindex" />
  <title>ADN Minero · Control del Faldón</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="Control de faldones (tercios inferiores) para transmisiones de ADN Minero: lanzar, cambiar y quitar en vivo." />
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    *{box-sizing:border-box}
    html,body{ margin:0; font-family:'Inter', system-ui, sans-serif; color:#f4ece5; }
    body{ min-height:100vh; background:radial-gradient(1000px 600px at 12% -8%, rgba(207,155,111,0.12), transparent 60%), #141110; }
    .wrap{ max-width:560px; margin:0 auto; padding:16px 16px 44px; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.62), rgba(26,21,18,0.44)); border:1px solid rgba(196,168,148,0.14); }
    input{ background:#241d18; color:#f4ece5; border:1px solid rgba(196,168,148,.25); border-radius:12px; padding:12px 13px; font-size:16px; outline:none; width:100%; }
    input:focus{ border-color:rgba(207,155,111,.6); }
    label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#9c8f83; }
    .btn{ border:0; border-radius:14px; padding:15px; font-weight:800; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s; }
    .btn:active{ transform:scale(.97) }
    .go{ background:linear-gradient(150deg,#6fae8c,#4c8f6b); color:#08160f; }
    .stop{ background:linear-gradient(150deg,#e08a72,#c15a44); color:#180b07; }
    /* preview del faldón */
    .pv{ position:relative; height:150px; border-radius:14px; overflow:hidden; background:linear-gradient(135deg,#22303a,#161f27); border:1px solid rgba(196,168,148,.14); }
    .pv::after{ content:'VISTA PREVIA'; position:absolute; top:8px; right:10px; font-size:9px; letter-spacing:.1em; color:rgba(255,255,255,.35); }
    .pvlt{ position:absolute; left:16px; bottom:16px; display:flex; align-items:stretch; }
    .pvbar{ width:5px; border-radius:4px; background:linear-gradient(#e8c9a6,#cf9b6f 55%,#b5734f); }
    .pvpanel{ margin-left:9px; padding:9px 15px 10px 12px; border-radius:9px; background:linear-gradient(120deg,rgba(20,15,12,.94),rgba(30,22,17,.9)); border:1px solid rgba(207,155,111,.35); min-width:150px; }
    .pvmark{ font-family:'Archivo'; font-weight:800; font-size:9px; letter-spacing:1.4px; text-transform:uppercase; color:#e8c9a6; margin-bottom:3px; }
    .pvl1{ font-family:'Archivo'; font-weight:900; font-size:22px; line-height:1; color:#fff; }
    .pvl2{ font-size:11.5px; font-weight:600; color:#e8c9a6; text-transform:uppercase; letter-spacing:.04em; margin-top:3px; }
    .pvl2:empty{ display:none }
    .chip{ font-size:12px; font-weight:600; padding:7px 11px; border-radius:999px; cursor:pointer; background:rgba(232,201,166,.08); border:1px solid rgba(196,168,148,.24); color:#e8c9a6; }
    .lnk{ color:#e8c9a6; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="glass rounded-2xl p-4 flex items-center gap-3">
      <div class="h-11 w-11 rounded-xl grid place-items-center shrink-0" style="background:rgba(207,155,111,.15);border:1px solid rgba(207,155,111,.32)"><i data-lucide="captions" style="width:24px;height:24px;color:#cf9b6f"></i></div>
      <div class="min-w-0 flex-1">
        <p style="margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e0c3a0;font-weight:800">Control del Faldón</p>
        <p style="margin:0;font-size:11px;color:#9c8f83">Tercio inferior para tu transmisión</p>
      </div>
      <span id="state" class="text-[11px] font-bold px-2.5 py-1 rounded-full" style="background:rgba(255,255,255,.06);color:#b7a794">…</span>
    </header>

    <!-- Vista previa -->
    <div class="pv mt-4">
      <div class="pvlt"><div class="pvbar"></div><div class="pvpanel"><div class="pvmark">● ADN Minero</div><div class="pvl1" id="pvl1">Nombre</div><div class="pvl2" id="pvl2"></div></div></div>
    </div>

    <!-- Datos -->
    <section class="glass rounded-2xl p-4 mt-4 grid gap-3">
      <div><label>Nombre / título</label><input id="l1" placeholder="Ej: Juan Pérez" maxlength="80" autocomplete="off"></div>
      <div><label>Rol / cargo / subtítulo</label><input id="l2" placeholder="Ej: Operador CAEX · Escondida" maxlength="80" autocomplete="off"></div>
      <div class="grid grid-cols-2 gap-3 mt-1">
        <button id="go" class="btn go"><i data-lucide="play" style="width:18px;height:18px"></i> Lanzar</button>
        <button id="stop" class="btn stop"><i data-lucide="square" style="width:18px;height:18px"></i> Quitar</button>
      </div>
      <p id="msg" class="text-[12px] text-center hidden"></p>
    </section>

    <!-- Recientes -->
    <div class="mt-4">
      <p class="text-[11px] text-stone-400 mb-2">Recientes (toca para reusar):</p>
      <div id="recent" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- OBS -->
    <section class="glass rounded-2xl p-4 mt-4 grid gap-3">
      <div class="rounded-xl p-3" style="background:rgba(103,193,214,.08);border:1px solid rgba(103,193,214,.25)">
        <p class="text-[11px] text-stone-400 mb-1">URL para OBS (Fuente → Navegador):</p>
        <div class="flex items-center gap-2">
          <code id="obsurl" class="text-[12px] flex-1 truncate" style="color:#a9d3dc">…</code>
          <button id="copy" class="chip shrink-0">Copiar</button>
        </div>
        <p class="text-[11px] text-stone-500 mt-2">En OBS: 1920×1080, fondo transparente. Controla desde aquí (incluso desde el celular).</p>
      </div>
    </section>

    <p class="text-center text-[11px] text-stone-500 mt-5"><a href="index.html" class="lnk">Inicio</a></p>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const WORKER='https://adn-muro.simonrovi.workers.dev/lt';
  const OBS=location.href.replace(/faldon-control\.html.*$/,'faldon.html').replace(/[^/]*$/,'adn-minero-faldon.html');
  $('obsurl').textContent = new URL('adn-minero-faldon.html', location.href).href;
  if(window.lucide) lucide.createIcons();

  // Preview en vivo
  function updPreview(){ $('pvl1').textContent=$('l1').value||'Nombre'; $('pvl2').textContent=$('l2').value||''; }
  $('l1').addEventListener('input', updPreview); $('l2').addEventListener('input', updPreview); updPreview();

  function msg(t,c){ const m=$('msg'); if(!t){ m.classList.add('hidden'); return; } m.textContent=t; m.style.color=c||'#c9b7a5'; m.classList.remove('hidden'); }

  function getRecent(){ try{ return JSON.parse(localStorage.getItem('adn_lt_recent')||'[]'); }catch(e){ return []; } }
  function saveRecent(l1,l2){ if(!l1) return; let r=getRecent().filter(x=>!(x.l1===l1&&x.l2===l2)); r.unshift({l1,l2}); r=r.slice(0,6); try{ localStorage.setItem('adn_lt_recent', JSON.stringify(r)); }catch(e){} renderRecent(); }
  function renderRecent(){ const r=getRecent(); $('recent').innerHTML = r.length? r.map((x,i)=>`<button class="chip rc" data-i="${i}">${(x.l1||'').replace(/[<>]/g,'')}${x.l2?(' · '+(x.l2||'').replace(/[<>]/g,'')):''}</button>`).join('') : '<span class="text-[12px] text-stone-500">Aún no hay recientes.</span>'; }
  $('recent').addEventListener('click',e=>{ const b=e.target.closest('.rc'); if(!b) return; const x=getRecent()[+b.dataset.i]; if(x){ $('l1').value=x.l1||''; $('l2').value=x.l2||''; updPreview(); } });
  renderRecent();

  let busy=false;
  async function send(show){
    if(busy) return;
    const l1=$('l1').value.trim(), l2=$('l2').value.trim();
    busy=true; msg('Enviando…');
    try{
      const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({l1,l2,show})});
      if(!r.ok){ msg('Error del servidor ('+r.status+').','#e88'); busy=false; return; }
      msg(show?'✅ Faldón en pantalla':'⏹ Faldón quitado', show?'#9ed9ba':'#c9b7a5');
      if(show) saveRecent(l1,l2);
      refresh();
    }catch(e){ msg('No se pudo conectar.','#e88'); }
    busy=false;
  }
  $('go').addEventListener('click',()=>send(true));
  $('stop').addEventListener('click',()=>send(false));

  async function refresh(){
    try{ const s=await fetch(WORKER,{cache:'no-store'}).then(r=>r.json());
      const on=!!s.show && !!(s.l1||s.l2);
      $('state').textContent=on?'🟢 En pantalla':'⚫ Oculto';
      $('state').style.color=on?'#9ed9ba':'#b7a794';
      $('state').style.background=on?'rgba(127,191,154,.18)':'rgba(255,255,255,.06)';
    }catch(e){}
  }
  refresh(); setInterval(refresh, 2500);

  $('copy').addEventListener('click',()=>{ const t=$('obsurl').textContent; try{ navigator.clipboard.writeText(t); const b=$('copy'); b.textContent='✓'; setTimeout(()=>b.textContent='Copiar',1200); }catch(e){} });
</script>
</body>
</html>
