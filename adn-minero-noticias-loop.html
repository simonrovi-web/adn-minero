<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADN Minero · Noticias en bucle</title>
<meta name="description" content="Todos los canales de noticias mineras en vivo de ADN Minero, con voz en off, rotando en bucle para pantalla y streaming (OBS)." />
<meta name="theme-color" content="#000000" />
<style>
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,sans-serif }
  #stage{ position:fixed; inset:0; background:#000 }
  iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    opacity:0; transition:opacity .6s ease }
  iframe.on{ opacity:1 }
  /* Chip de estado / "a continuación" */
  #hud{ position:fixed; left:18px; bottom:16px; z-index:5; display:flex; align-items:center; gap:10px;
    background:rgba(10,8,6,.62); border:1px solid rgba(207,155,111,.35); color:#f0e6da;
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:700; backdrop-filter:blur(6px);
    opacity:0; transition:opacity .4s; pointer-events:none }
  #hud.show{ opacity:1 }
  #hud .d{ width:7px;height:7px;border-radius:50%;background:#7ee787;box-shadow:0 0 8px #7ee787;animation:pz 1.5s infinite }
  #hud small{ color:#cbb79f; font-weight:600 }
  @keyframes pz{0%,100%{opacity:1}50%{opacity:.3}}
  /* Aviso inicial (gesto para permitir audio en navegador; OBS no lo necesita) */
  #gate{ position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    background:radial-gradient(1000px 600px at 50% 30%, rgba(207,155,111,.12), transparent 60%), #0e0b09; color:#f0e6da; text-align:center; padding:24px }
  #gate h1{ font-size:clamp(24px,4vw,40px); font-weight:900; margin:0 }
  #gate p{ color:#b9a892; margin:0; max-width:52ch; font-size:15px }
  #gate button{ margin-top:8px; background:linear-gradient(90deg,#e8b680,#cf9b6f); color:#241812; border:0; font-weight:900;
    font-size:16px; padding:13px 26px; border-radius:999px; cursor:pointer }
  #gate small{ color:#8c7d6b; font-size:12px }
</style>
</head>
<body>
  <div id="stage">
    <iframe id="fa" allow="autoplay" scrolling="no"></iframe>
    <iframe id="fb" allow="autoplay" scrolling="no"></iframe>
  </div>
  <div id="hud"><span class="d"></span><span id="hudt">—</span></div>

  <div id="gate">
    <h1>📺 Noticias Mineras · en bucle</h1>
    <p id="gtext">Rota los canales de noticias en vivo con voz en off. Cada canal pasa al siguiente cuando termina de narrar sus noticias.</p>
    <button id="gbtn">▶️ Comenzar</button>
    <small>En OBS arranca solo (agrega <b>?auto=1</b> al link). En el navegador, un clic permite el audio.</small>
  </div>

<script>
  var CH = [
    ['adn-minero-noticias-vivo.html','Minería'],
    ['adn-minero-mercado-vivo.html','Mercado del Cobre'],
    ['adn-minero-geo-vivo.html','Geopolítica'],
    ['adn-minero-energia-vivo.html','Energía y Desarrollo'],
    ['adn-minero-litio-vivo.html','Litio y Salares'],
    ['adn-minero-seguridad-vivo.html','Seguridad Minera'],
    ['adn-minero-tecnologia-vivo.html','Tecnología y Minería 4.0'],
    ['adn-minero-territorio-vivo.html','Comunidades, Agua y Territorio'],
    ['adn-minero-talento-vivo.html','Talento Minero']
  ];
  var P = new URLSearchParams(location.search);
  var N   = Math.max(1, parseInt(P.get('n'),10) || 12);          // noticias por canal antes de rotar
  var VOZ = (P.get('voz')||'azure').toLowerCase();                // voz: azure | neural | browser
  if(['azure','neural','browser'].indexOf(VOZ)<0) VOZ='azure';
  var AUTO = /^(1|true|si|on)$/i.test(P.get('auto')||'');          // arranque automático (OBS)
  var ORDER = (P.get('solo')||'').trim();                          // opcional: limita/ordena canales por palabra

  // Filtro opcional ?solo=litio,seguridad
  if(ORDER){ var w=ORDER.toLowerCase().split(',').map(function(s){return s.trim();}).filter(Boolean);
    var f=CH.filter(function(c){ return w.some(function(k){ return c[0].indexOf(k)>=0; }); }); if(f.length) CH=f; }

  // Un SOLO iframe: al cambiar el src, el canal anterior se descarga y su voz se corta
  // de inmediato → nunca se escuchan dos voces a la vez.
  var frame=document.getElementById('fa');
  var fb=document.getElementById('fb'); if(fb) fb.style.display='none';
  var hud=document.getElementById('hud'), hudt=document.getElementById('hudt');
  var i=-1, count=0, safety=null, started=false, switching=false;

  function chUrl(k){ return CH[k][0]+'?voz='+encodeURIComponent(VOZ)+'&auto=1'; }
  function setHud(k){ hudt.innerHTML = CH[k][1] + ' &nbsp;<small>· canal '+(k+1)+'/'+CH.length+'</small>';
    hud.classList.add('show'); clearTimeout(setHud._t); setHud._t=setTimeout(function(){ hud.classList.remove('show'); }, 6000); }

  function resetSafety(){ clearTimeout(safety); safety=setTimeout(nextChannel, 95000); } // si una noticia se cuelga, igual avanza

  function loadChannel(k){
    switching=true; clearTimeout(safety);
    i = ((k % CH.length) + CH.length) % CH.length;
    count = 0;
    frame.classList.remove('on'); // fundido de salida mientras recarga (tapa el parpadeo)
    setTimeout(function(){
      frame.onload = function(){ frame.classList.add('on'); setHud(i); switching=false; resetSafety(); };
      frame.src = chUrl(i); // reemplazar el src descarga el canal anterior y detiene su audio
    }, 420);
  }
  function nextChannel(){ if(switching) return; loadChannel(i+1); }

  // El panel embebido avisa cada vez que termina de narrar una noticia
  window.addEventListener('message', function(e){
    var d = e.data; if(!d || d.adn!=='narrated') return;
    if(switching) return;
    count = d.n || (count+1);
    resetSafety();
    if(count >= N) nextChannel();
  });

  function start(){
    if(started) return; started=true;
    document.getElementById('gate').style.display='none';
    loadChannel(0);
  }
  document.getElementById('gbtn').addEventListener('click', start);
  // OBS (o navegadores que permiten autoplay): arranca solo
  if(AUTO) start();
</script>
</body>
</html>
