<script>
  (function(){
    var CFG={
      queries:['cobre precio Chile','precio del cobre','cobre Codelco','litio precio','mercado del cobre'],
      topic:'el mercado del cobre y los minerales (precios, dólar y proyecciones) y cómo afecta a Chile',
      label:'Mercado'
    };
    var WORKER='https://adn-minero-ia.simonrovi.workers.dev';
    var api=function(q){ return 'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=es-419&gl=CL&ceid=CL:es'); };
    var $=function(id){ return document.getElementById(id); };
    var draw=function(){ try{ window.lucide&&lucide.createIcons(); }catch(e){} };

    // reloj
    function tick(){ try{ $('clock').textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',timeZone:'America/Santiago'}); }catch(e){} }
    tick(); setInterval(tick,30000);

    function rel(ts){ if(!ts) return ''; var s=(Date.now()-ts)/1000; if(s<3600) return 'hace '+Math.max(1,Math.round(s/60))+' min'; if(s<86400) return 'hace '+Math.round(s/3600)+' h'; return 'hace '+Math.round(s/86400)+' d'; }
    function clean(t){ t=(t||'').trim(); var i=t.lastIndexOf(' - '); return i>40 ? {t:t.slice(0,i), s:t.slice(i+3)} : {t:t, s:''}; }
    function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
    async function feedOnce(q){
      try{ var ctl=new AbortController(), to=setTimeout(function(){ctl.abort();},9000);
        var r=await fetch(api(q),{signal:ctl.signal}); var j=await r.json(); clearTimeout(to);
        if(j&&j.status==='ok'&&j.items&&j.items.length) return j.items; }catch(e){} return null;
    }
    async function feedOne(q){
      var items=await feedOnce(q);
      if(!items){ await sleep(1400); items=await feedOnce(q); } // reintento: rss2json a veces falla la 1a vez
      return items||[];
    }
    async function loadNews(){
      // secuencial con espaciado para no gatillar el throttle de rss2json (ráfaga = "Internal error")
      var seen={}, out=[], now=Date.now();
      function absorb(items){ items.forEach(function(it){
        var c=clean(it.title); if(!c.t||c.t.length<22) return;
        var k=c.t.toLowerCase().slice(0,55); if(seen[k]) return; seen[k]=1;
        var ts=it.pubDate?Date.parse(it.pubDate):0; if(ts && (now-ts)>5184e6) return; // hasta 60 días
        out.push({t:c.t, s:c.s||(it.author||''), link:it.link||'#', ts:ts});
      }); }
      for(var qi=0;qi<CFG.queries.length;qi++){ absorb(await feedOne(CFG.queries[qi])); if(qi<CFG.queries.length-1) await sleep(700); }
      // si el tema trae pocas, completa con minería general para asegurar variedad (mínimo ~15)
      var fill=['minería Chile','cobre Chile','Codelco'];
      for(var fi=0; fi<fill.length && out.length<15; fi++){ await sleep(700); absorb(await feedOne(fill[fi])); }
      out.sort(function(a,b){ return b.ts-a.ts; });
      return out.slice(0,24); // hasta 24 noticias (más recientes primero)
    }

    // ===== Contexto IA (con caché en localStorage) =====
    function ckey(h){ return 'adn_res3_'+h.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60); }
    function cacheGet(h){ try{ var v=JSON.parse(localStorage.getItem(ckey(h))||'null'); if(v&&v.x&&(Date.now()-v.ts)<864e5) return v.x; }catch(e){} return null; }
    function cacheSet(h,x){ try{ localStorage.setItem(ckey(h), JSON.stringify({x:x,ts:Date.now()})); }catch(e){} }
    var curCtl=null;
    // lee el stream SSE de la IA; acumula y entrega por onChunk; devuelve el texto final ('' si falla)
    async function readSSE(res, onChunk){
      if(!res || !res.ok || !res.body) return '';
      var reader=res.body.getReader(), dec=new TextDecoder(), buf='', acc='';
      while(true){ var r=await reader.read(); if(r.done) break;
        buf+=dec.decode(r.value,{stream:true}); var lines=buf.split('\n'); buf=lines.pop();
        for(var i=0;i<lines.length;i++){ var l=lines[i].trim(); if(l.indexOf('data:')!==0) continue; var d=l.slice(5).trim(); if(d==='[DONE]') continue;
          try{ var jj=JSON.parse(d); if(jj.response){ acc+=jj.response; if(onChunk) onChunk(acc,false); } }catch(e){} }
      }
      return acc.trim();
    }
    // pide al Worker el RESUMEN de la noticia (decodifica Google News + baja el artículo real + IA)
    async function streamResumen(title, link, onChunk){
      try{ if(curCtl) curCtl.abort(); }catch(e){} curCtl=new AbortController();
      var res=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'resumen',title:title,link:link||'',topic:CFG.topic}),signal:curCtl.signal});
      return await readSSE(res, onChunk);
    }
    async function getContext(h, link, onChunk){
      var cached=cacheGet(h); if(cached){ onChunk(cached,true); return; }
      for(var intento=0;intento<3;intento++){ // 3 intentos: resiste hipos transitorios del Worker
        try{
          var acc=await streamResumen(h, link, onChunk);
          if(acc){ cacheSet(h,acc); onChunk(acc,true); return; }
        }catch(e){ if(e&&e.name==='AbortError') return; }
        await sleep(1500);
      }
      // respaldo (sin "tocar"): la fuente va abajo

    function keyFigure(t){

        /US?\$\s?[\d.,]+\s?(?:mil\s+)?(?:millones|millón|billones|bn|mm)\b|US?\$\s?[\d.,]+/i,
        /[\d.,]+\s?%/,
        /[\d.,]+\s?(?:mil\s?)?(?:millones|millón|billones)\s?(?:de\s?)?(?:dólares|dolares|pesos|toneladas|ton)?/i,
        /[\d.,]+\s?(?:toneladas|ton|kt|mt|kton)\b/i,
        /[\d.,]+\s?(?:MW|GWh|MWh|GW|TWh)\b/i,
        /[\d.,]+\s?(?:m³|m3|litros?|hm³)\b/i
      ];
      for(var i=0;i<pats.length;i++){ var m=t.match(pats[i]);
        if(m){ var v=m[0].trim();
          // descarta años sueltos (1900-2099) sin unidad
          if(/^\d{4}$/.test(v) && +v>=1900 && +v<=2099) continue;
          return v.replace(/\s+/g,' ');
        }
      }

    }

    var Voz=(function(){

        active:function(){ return on&&mode!=='off'; },
        enabled:function(){ return mode!=='off'; },
        start:function(){ if(!on&&mode!=='off') activate(); },
        onNarrationEnd:function(fn){ endCb=fn; },
        onChange:function(fn){ changeCb=fn; }
      };
    })();

    function show(i){
      idx=((i%STORIES.length)+STORIES.length)%STORIES.length;
      var s=STORIES[idx];
      var head=$('head'), ctx=$('ctx');
      head.classList.add('out'); ctx.classList.add('out');
      setTimeout(function(){
        $('metaline').textContent=(s.s?s.s+' · ':'')+rel(s.ts);
        head.textContent=s.t; $('cta').href=s.link;
        var tv=topicVisual(s.t); var fi=$('featImg'), fsc=$('featScene'); if(fi){ fi.style.background=tv.g; } if(fsc){ fsc.innerHTML=tv.svg; }
        var fp=$('fiPhoto'); if(fi){ fi.classList.remove('has-photo'); } if(fp){ fp.removeAttribute('src'); } clearCap();
        var ff=$('featFig'); if(ff){ var kf=keyFigure(s.t); if(kf){ ff.textContent=kf; ff.classList.add('on'); } else { ff.textContent=''; ff.classList.remove('on'); } }
        var ra=$('readat'); if(ra){ ra.innerHTML='<span style="opacity:.85">📰 Lee la nota completa en</span>&nbsp; <b>'+esc(s.s||'la fuente original')+'</b>'; }
        ctx.innerHTML='<span class="skel" style="display:block;height:14px;width:92%;margin-bottom:8px"></span><span class="skel" style="display:block;height:14px;width:76%"></span>';
        head.classList.remove('out'); ctx.classList.remove('out');
        var myIdx=idx;
        Voz.onStory(s.t); // narra el titular (si la voz está activa)
        getContext(s.t, s.link, function(txt, done){ if(myIdx!==idx) return; ctx.innerHTML=esc(txt)+(done?'':'<span class="cursor"></span>'); if(done) Voz.onSummary(txt); });
        loadFeat(s, myIdx); // foto real de la nota (o del tema); si no hay, queda la ilustración
        renderQueue();
        startBar();
        // precarga el resumen y la foto del siguiente para que el cambio sea instantáneo
        var nxt=STORIES[(idx+1)%STORIES.length]; if(nxt){ prefetchResumen(nxt.t, nxt.link); prefetchImg(nxt); }
      }, 380);
    }
    function go(i){ clearTimeout(timer); show(i); schedule(); }
    function schedule(){ clearTimeout(timer);
      // con voz activa, avanza al terminar la narración (timer largo solo de seguridad)
      var d=(Voz&&Voz.active())?75000:DWELL;
      timer=setTimeout(function(){ show(idx+1); schedule(); }, d); }
    // avanza cuando la voz termina de relatar el resumen (pausa breve entre noticias)
    var _narr=0;
    Voz.onNarrationEnd(function(){ clearTimeout(timer);
      _narr++; // avisa al reproductor (si está embebido) que terminó de narrarse una noticia
      try{ if(window.parent && window.parent!==window) window.parent.postMessage({adn:'narrated', n:_narr, label:CFG.label}, '*'); }catch(e){}
      timer=setTimeout(function(){ show(idx+1); schedule(); }, 1400); });
    // si se activa/desactiva/cambia la voz, re-agenda con el criterio correcto
    Voz.onChange(function(){ if(STORIES.length) schedule(); });

    async function boot(){
      var s=await loadNews();
      if(!s.length){ $('head').textContent='No hay titulares por ahora'; $('ctx').textContent='Revisa tu conexión y vuelve a intentar.'; return; }
      STORIES=s; idx=-1; show(0); schedule(); draw();
      // Arranque automático de la voz (para OBS, que permite autoplay): ?auto=1
      try{ if(/^(1|true|si|on)$/i.test(new URLSearchParams(location.search).get('auto')||'') && Voz && Voz.enabled()){
        setTimeout(function(){ Voz.start(); }, 1200);
      } }catch(e){}
      setInterval(async function(){ var ns=await loadNews(); if(ns.length){ STORIES=ns; renderQueue(); } }, 600000);
    }
    draw();
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
</body>
</html>
