<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ADN Minero · Métricas</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="Métricas de uso del portal ADN Minero." />
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root{ --copper:#cf9b6f; }
    *{box-sizing:border-box}
    html,body{ margin:0; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; color:#f4ece5; }
    body{ min-height:100vh; background:
      radial-gradient(1200px 700px at 15% -10%, rgba(207,155,111,0.10), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, rgba(103,193,214,0.08), transparent 55%),
      #141110; }
    .wrap{ max-width:680px; margin:0 auto; padding:16px 16px 48px; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.62), rgba(26,21,18,0.44)); backdrop-filter:blur(14px) saturate(130%); -webkit-backdrop-filter:blur(14px) saturate(130%); border:1px solid rgba(196,168,148,0.14); }
    input,select{ background:#241d18; color:#f4ece5; border:1px solid rgba(196,168,148,.25); border-radius:12px; padding:11px 12px; font-size:15px; outline:none; }
    input:focus,select:focus{ border-color:rgba(207,155,111,.6); }
    button.btn{ background:linear-gradient(160deg,#3a2a22,#2a1d17); border:1px solid rgba(207,155,111,.45); color:#f0d7b6; border-radius:12px; padding:11px 16px; font-weight:700; }
    .bar{ height:9px; border-radius:999px; background:linear-gradient(90deg,#cf9b6f,#e8c9a6); }
    .barbg{ height:9px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; }
  </style>
  <script src="adn-ui.js" defer></script>
</head>
<body>
  <div class="wrap">

    <header class="glass rounded-2xl p-4 flex items-center gap-3">
      <div class="h-12 w-12 rounded-xl grid place-items-center shrink-0" style="background:rgba(207,155,111,.15);border:1px solid rgba(207,155,111,.32)"><i data-lucide="bar-chart-3" style="width:26px;height:26px;color:#cf9b6f;filter:drop-shadow(0 0 8px currentColor)"></i></div>
      <div class="min-w-0">
        <p style="margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e0c3a0;font-weight:700">Métricas · ADN Minero</p>
        <p style="margin:0;font-size:11px;color:#9c8f83">Vistas por panel · privado (solo con token)</p>
      </div>
    </header>

    <div class="glass rounded-2xl p-4 mt-4 grid gap-3">
      <div class="grid gap-1">
        <label class="text-[11px] text-stone-400 font-semibold uppercase tracking-wide">Token de administrador</label>
        <input id="tok" type="password" placeholder="Tu token de admin" autocomplete="off">
      </div>
      <div class="flex gap-2 items-end">
        <div class="grid gap-1 flex-1">
          <label class="text-[11px] text-stone-400 font-semibold uppercase tracking-wide">Periodo</label>
          <select id="days">
            <option value="7">Últimos 7 días</option>
            <option value="30" selected>Últimos 30 días</option>
            <option value="90">Últimos 90 días</option>
            <option value="365">Último año</option>
          </select>
        </div>
        <button id="go" class="btn">Ver</button>
      </div>
      <label class="flex items-center gap-2 text-[12px] text-stone-400"><input id="rem" type="checkbox" style="width:auto"> Recordar el token en este dispositivo</label>
    </div>

    <div id="msg" class="hidden text-center text-sm py-4"></div>

    <div id="resumen" class="hidden mt-4 grid grid-cols-2 gap-3">
      <div class="glass rounded-2xl p-4 text-center"><p id="kTotal" class="text-3xl font-extrabold" style="color:#e8c9a6">–</p><p class="text-[11px] text-stone-400 mt-1">vistas totales</p></div>
      <div class="glass rounded-2xl p-4 text-center"><p id="kPaneles" class="text-3xl font-extrabold" style="color:#a9d3dc">–</p><p class="text-[11px] text-stone-400 mt-1">paneles con vistas</p></div>
    </div>

    <div id="lista" class="mt-4 grid gap-2"></div>

    <p class="text-center text-[11px] text-stone-500 mt-6 leading-relaxed">Datos anónimos y agregados: no se guarda IP, cookies ni información personal. Respeta “No rastrear”. · <a href="index.html" style="color:#e8c9a6">Inicio</a></p>
  </div>

<script>
  const BASE='https://adn-muro.simonrovi.workers.dev';
  const $=id=>document.getElementById(id);
  const drawIcons=()=>window.lucide&&lucide.createIcons();
  // nombre bonito a partir del archivo
  const nice=f=>(f||'').replace(/\.html$/,'').replace(/^adn-minero-/,'').replace(/^index$/,'portada').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

  try{ const t=localStorage.getItem('adn_metrics_tok'); if(t){ $('tok').value=t; $('rem').checked=true; } }catch(e){}

  function setMsg(t,color){ const m=$('msg'); if(!t){ m.classList.add('hidden'); return; } m.textContent=t; m.style.color=color||'#c9b7a5'; m.classList.remove('hidden'); }

  async function load(){
    const tok=$('tok').value.trim();
    if(!tok){ setMsg('Ingresa tu token de administrador.','#e0a35a'); return; }
    try{ if($('rem').checked) localStorage.setItem('adn_metrics_tok',tok); else localStorage.removeItem('adn_metrics_tok'); }catch(e){}
    setMsg('Cargando…');
    $('resumen').classList.add('hidden'); $('lista').innerHTML='';
    try{
      const r=await fetch(`${BASE}/m/stats?token=${encodeURIComponent(tok)}&days=${$('days').value}`);
      if(r.status===401){ setMsg('Token incorrecto.','#e88'); return; }
      if(!r.ok){ setMsg('Error del servidor ('+r.status+').','#e88'); return; }
      const d=await r.json();
      setMsg('');
      $('kTotal').textContent=(d.total||0).toLocaleString('es-CL');
      $('kPaneles').textContent=(d.paneles||[]).length.toLocaleString('es-CL');
      $('resumen').classList.remove('hidden');
      const max=Math.max(1, ...(d.paneles||[]).map(p=>p.views));
      if(!(d.paneles||[]).length){ $('lista').innerHTML='<p class="text-center text-stone-500 text-sm py-6">Aún no hay vistas registradas en este periodo.</p>'; return; }
      $('lista').innerHTML=(d.paneles||[]).map((p,i)=>`
        <div class="glass rounded-2xl p-3.5">
          <div class="flex items-center justify-between gap-3 mb-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[11px] font-bold w-6 text-center shrink-0" style="color:#8a8079">${i+1}</span>
              <p class="font-bold truncate">${nice(p.panel)}</p>
            </div>
            <p class="font-extrabold shrink-0" style="color:#e8c9a6">${(p.views||0).toLocaleString('es-CL')}</p>
          </div>
          <div class="barbg"><div class="bar" style="width:${Math.max(4,Math.round(p.views/max*100))}%"></div></div>
        </div>`).join('');
    }catch(e){ setMsg('No se pudo conectar. Revisa tu conexión.','#e88'); }
  }

  $('go').addEventListener('click', load);
  $('tok').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
  drawIcons();
</script>
</body>
</html>
