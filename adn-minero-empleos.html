    {tipo:'Servicio', cat:'Alimentación y campamentos', titulo:'Aramark Chile · Casinos y campamentos', empresa:'Aramark', detalle:'Alimentación, aseo y operación de campamentos mineros.', link:'https://www.aramark.cl/'},

    {tipo:'Servicio', cat:'Seguridad y EPP', titulo:'3M Chile · Protección personal', empresa:'3M', detalle:'Respiradores, cascos, protección auditiva y soluciones de seguridad.', link:'https://www.3m.cl/'},

    // --- Laboratorio / análisis ---
    {tipo:'Servicio', cat:'Análisis y certificación', titulo:'SGS Chile · Laboratorio y certificación', empresa:'SGS', detalle:'Análisis de minerales, inspección y certificación para minería.', link:'https://www.sgs.com/es-cl'},

    {tipo:'Servicio', cat:'Ensayos y certificación', titulo:'Bureau Veritas Chile · Ensayos', empresa:'Bureau Veritas', detalle:'Inspección, ensayos de laboratorio y certificación minera.', link:'https://www.bureauveritas.cl/'},
    // --- Automatización / tecnología ---
    {tipo:'Servicio', cat:'Automatización', titulo:'ABB Chile · Automatización minera', empresa:'ABB', detalle:'Electrificación, automatización y digitalización de faenas.', link:'https://new.abb.com/cl'},
    {tipo:'Servicio', cat:'Tecnología industrial', titulo:'Siemens Chile · Tecnología', empresa:'Siemens', detalle:'Automatización, energía y digitalización para la minería.', link:'https://www.siemens.com/cl/es.html'},
    {tipo:'Servicio', cat:'Tecnología y software', titulo:'Hexagon Mining · Software y sensores', empresa:'Hexagon', detalle:'Software de planificación, seguridad y operación autónoma.', link:'https://hexagon.com/'},
    {tipo:'Servicio', cat:'Control industrial', titulo:'Rockwell Automation · Control', empresa:'Rockwell', detalle:'Sistemas de control y automatización de procesos mineros.', link:'https://www.rockwellautomation.com/es-cl.html'},
    // --- Mantención / servicios eléctricos ---
    {tipo:'Servicio', cat:'Servicios eléctricos', titulo:'Servicios eléctricos y montajes · Buscar', empresa:'Directorio', detalle:'Empresas de montaje eléctrico e instrumentación para faenas mineras.', link:jq('empresas montaje eléctrico instrumentación minería Chile')},
  ];
  const norm=s=>(s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

  let listings=[], filtered=[], page=0, filter='todos', paused=false, rotTimer=null;

  function tick(){ const n=new Date();
    $('clock').textContent=n.toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    $('clockDate').textContent=n.toLocaleDateString('es-CL',{timeZone:TZ,weekday:'long',day:'2-digit',month:'long'})+' · hora Chile';
  }

  function card(it){
    const isJob=it.tipo==='Trabajo';
    const c = isJob ? '#cf9b6f' : '#7fbfd1';
    const ic = isJob ? 'hard-hat' : 'wrench';
    const btn = isJob ? 'Ver ofertas y postular' : 'Ver servicios / Contactar';
    return `<div class="card-job glass-strong rounded-2xl p-5 flex flex-col gap-2.5 relative overflow-hidden transition" style="border-color:${c}22">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full inline-flex items-center gap-1.5" style="background:${c}1f;border:1px solid ${c}44;color:${c}"><i data-lucide="${ic}" class="w-3.5 h-3.5"></i> ${isJob?'Postulación':'Proveedor'}</span>
        ${it.cat?`<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full text-stone-300" style="background:${c}14;border:1px solid ${c}2e">${it.cat}</span>`:''}
      </div>
      <h3 class="text-[18px] font-bold leading-tight">${it.titulo}</h3>
      ${it.empresa?`<p class="flex items-center gap-1.5 text-sm text-stone-300 truncate"><i data-lucide="building-2" class="w-4 h-4 text-stone-500 shrink-0"></i> ${it.empresa}</p>`:''}
      ${it.detalle?`<p class="text-[13px] text-stone-400 leading-snug flex-1" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${it.detalle}</p>`:'<div class="flex-1"></div>'}
      <a href="${it.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-semibold rounded-lg px-3 py-2 w-fit active:scale-95 transition" style="color:${c};background:${c}14;border:1px solid ${c}33"><i data-lucide="external-link" class="w-4 h-4"></i> ${btn}</a>
    </div>`;
  }

  function applyFilter(){ filtered = filter==='todos' ? listings : listings.filter(x=>norm(x.tipo)===filter); if(page>=pages()) page=0; }
  function pages(){ return Math.max(1, Math.ceil(filtered.length/PAGE)); }
  function render(){
    const start=page*PAGE, slice=filtered.slice(start, start+PAGE);
    $('grid').innerHTML = slice.length ? slice.map(card).join('') : `<div class="col-span-3 grid place-items-center text-stone-500 gap-3 py-10"><i data-lucide="inbox" class="w-12 h-12"></i><p>No hay avisos en esta categoría por ahora.</p></div>`;
    const total=filtered.length;
    $('pageInfo').textContent = total ? `${Math.min(start+1,total)}–${Math.min(start+slice.length,total)} de ${total} · página ${page+1}/${pages()}` : '0 avisos';
    drawIcons();
  }
  function restartProgress(ms){ const p=$('progress'); p.style.transition='none'; p.style.width='0%'; void p.offsetWidth; if(!paused){ p.style.transition='width '+ms+'ms linear'; p.style.width='100%'; } }
  function schedule(){ clearTimeout(rotTimer); if(paused){ return; } if(pages()>1){ restartProgress(ROTATE_MS); rotTimer=setTimeout(next, ROTATE_MS); } else restartProgress(0); }
  function goto(p){ const n=pages(); page=((p%n)+n)%n; render(); schedule(); }
  function next(){ goto(page+1); }
  function prev(){ goto(page-1); }
  function setFilter(f){ filter=f; page=0; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on', b.dataset.tab===f)); applyFilter(); render(); schedule(); }
  function togglePause(){ paused=!paused; $('pauseIcon').setAttribute('data-lucide', paused?'play':'pause'); drawIcons(); if(paused){ clearTimeout(rotTimer); const p=$('progress'); p.style.transition='none'; p.style.width=getComputedStyle(p).width; } else schedule(); }

  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>setFilter(b.dataset.tab)));
  $('prevBtn').addEventListener('click', prev);
  $('nextBtn').addEventListener('click', next);
  $('pauseBtn').addEventListener('click', togglePause);
  (function(){ var r=$('skiPP'); if(!r) return; var ic=$('skiPPicon'), disp=false;
    var PLAY='<path d="M8 5v14l11-7z"></path>', PAUSE='<rect x="6" y="5" width="4.2" height="14" rx="1.2"></rect><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"></rect>';
    r.addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return; var a=b.getAttribute('data-act');
      if(a==='next') next(); else if(a==='prev') prev(); else { togglePause(); disp=!disp; ic.innerHTML=disp?PLAY:PAUSE; } }); })();

  function updateTabCounts(){
    const t=listings.filter(x=>x.tipo==='Trabajo').length, s=listings.filter(x=>x.tipo==='Servicio').length;
    const bt=document.querySelector('[data-tab="todos"]'), b1=document.querySelector('[data-tab="trabajo"]'), b2=document.querySelector('[data-tab="servicio"]');
    if(bt) bt.textContent='Todos · '+listings.length;
    if(b1) b1.textContent='Trabajos · '+t;
    if(b2) b2.textContent='Servicios · '+s;
  }
  function load(){ listings=DATA.slice(); updateTabCounts(); applyFilter(); render(); schedule(); }

  function fitStageInit(){ function f(){ const w=innerWidth||1600,h=innerHeight||900; $('stage').style.setProperty('--s',Math.min(w/1600,h/900)||1); } addEventListener('resize',f); addEventListener('load',f); f(); }
  fitStageInit(); drawIcons(); tick(); setInterval(tick,1000); load();
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearTimeout(rotTimer); } else if(!paused){ schedule(); } });
</script>
