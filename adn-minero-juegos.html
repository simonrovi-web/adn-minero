<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ADN Minero · Juegos</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="Juegos: Todos los juegos mineros en un solo lugar: Trivia, Verdadero o Falso, Wordle y Memoria." />
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root{ --copper:#cf9b6f; }
    *{box-sizing:border-box}
    html,body{ margin:0; font-family:'Inter', system-ui, sans-serif; color:#f4ece5; }
    body{ min-height:100vh; background:
      radial-gradient(1100px 640px at 12% -8%, rgba(214,169,79,0.12), transparent 60%),
      radial-gradient(900px 560px at 100% 0%, rgba(103,193,214,0.08), transparent 55%),
      #141110; }
    .wrap{ max-width:560px; margin:0 auto; padding:16px 16px 40px; }
    .glass{ background:linear-gradient(160deg, rgba(43,37,32,0.62), rgba(26,21,18,0.44)); border:1px solid rgba(196,168,148,0.14); }
    .gcard{ display:flex; align-items:center; gap:14px; padding:16px; border-radius:20px; text-decoration:none; color:inherit; transition:transform .12s ease, border-color .12s ease; }
    .gcard:active{ transform:scale(.98) }
    .gicon{ width:54px; height:54px; border-radius:15px; display:grid; place-items:center; font-size:27px; flex:none; }
    .badge{ font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
    .best{ font-size:11px; color:#e8c9a6; font-weight:700; }
  </style>
  <script src="adn-ui.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="glass rounded-2xl p-4 flex items-center gap-3">
      <div class="h-12 w-12 rounded-xl grid place-items-center shrink-0" style="background:rgba(214,169,79,.15);border:1px solid rgba(214,169,79,.32)"><i data-lucide="gamepad-2" style="width:26px;height:26px;color:#d6a94f;filter:drop-shadow(0 0 8px currentColor)"></i></div>
      <div class="min-w-0">
        <p style="margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e6c98f;font-weight:800">Juegos · ADN Minero</p>
        <p style="margin:0;font-size:11px;color:#9c8f83">Aprende de minería jugando</p>
      </div>
    </header>

    <div class="grid gap-3 mt-4" id="games"></div>

    <p class="text-center text-[11px] text-stone-500 mt-6"><a href="index.html" style="color:#e8c9a6">← Inicio</a> · Todos con puntaje y récord guardados en tu dispositivo</p>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const drawIcons=()=>window.lucide&&lucide.createIcons();
  const gv=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };

  const GAMES=[
    { t:'Trivia Minera', f:'adn-minero-trivia.html', e:'🎯', c:'#d6a94f', badge:'Clásico', d:'100 preguntas de opción múltiple; 10 al azar por partida.', best:()=>null },
    { t:'Verdadero o Falso', f:'adn-minero-vf.html', e:'⚡', c:'#e0955f', badge:'Contrarreloj', d:'60 segundos para acertar la mayor cantidad de afirmaciones.', best:()=>{ const b=gv('adn_vf_best'); return b?('Mejor: '+b+' aciertos'):null; } },
    { t:'Wordle Minero', f:'adn-minero-wordle.html', e:'🟩', c:'#6aaa64', badge:'Diario', d:'Adivina la palabra minera de 5 letras del día.', best:()=>{ try{ const s=JSON.parse(gv('adn_wordle')||'{}'); return s.streak?('Racha: '+s.streak+' días'):null; }catch(e){ return null; } } },
    { t:'Memoria Minera', f:'adn-minero-memoria.html', e:'🧠', c:'#cf9b6f', badge:'Pares', d:'Encuentra los 8 pares en la menor cantidad de movimientos.', best:()=>{ const b=gv('adn_mem_best'); return b?('Récord: '+b+' mov.'):null; } }
  ];

  $('games').innerHTML=GAMES.map(g=>{
    const best=g.best();
    return `<a class="glass gcard" href="${g.f}">
      <div class="gicon" style="background:${g.c}22;border:1px solid ${g.c}55">${g.e}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <p class="font-extrabold text-[16px]">${g.t}</p>
          <span class="badge" style="background:${g.c}22;color:${g.c};border:1px solid ${g.c}55">${g.badge}</span>
        </div>
        <p class="text-[12.5px] text-stone-300 mt-0.5 leading-snug">${g.d}</p>
        ${best?`<p class="best mt-1">🏅 ${best}</p>`:''}
      </div>
      <i data-lucide="chevron-right" class="text-stone-500" style="width:20px;height:20px"></i>
    </a>`;
  }).join('');
  drawIcons();
</script>
</body>
</html>
