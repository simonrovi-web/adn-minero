<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADN Minero · Educación Minera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    html, body { height:100%; overflow:hidden; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; }
    body { background:
      radial-gradient(1200px 600px at 15% -10%, rgba(181,115,79,0.14), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(120,108,100,0.10), transparent 55%),
      #141110; }
    #viewport { position:fixed; inset:0; display:grid; place-items:center; }
    #stage { width:1600px; height:900px; transform-origin:center center; transform:scale(var(--s,1)); display:flex; flex-direction:column; padding:24px; gap:14px; }
    .glass { background:linear-gradient(160deg, rgba(43,37,32,0.60), rgba(26,21,18,0.40)); backdrop-filter:blur(16px) saturate(130%); -webkit-backdrop-filter:blur(16px) saturate(130%); border:1px solid rgba(196,168,148,0.13); box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,240,230,0.04); }
    .glass-strong { background:linear-gradient(160deg, rgba(48,41,35,0.75), rgba(28,23,19,0.55)); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); border:1px solid rgba(196,168,148,0.16); }
    .metric-icon{ filter:drop-shadow(0 0 8px currentColor); }
    .tabnum{ font-variant-numeric:tabular-nums; }
    #progress { box-shadow:0 0 10px rgba(181,115,79,.6); }
    .card-edu:hover{ border-color:rgba(207,155,111,.4); }
    .ctrl-btn{ display:grid; place-items:center; width:2.5rem; height:2.5rem; border-radius:999px; color:#e6d4c4; cursor:pointer; transition:transform .15s ease, border-color .25s ease, background .25s ease; background:linear-gradient(160deg, rgba(48,41,35,.78), rgba(28,23,19,.58)); border:1px solid rgba(196,168,148,.18); }
    .ctrl-btn:hover{ border-color:rgba(207,155,111,.55); color:#f0e2d3; } .ctrl-btn:active{ transform:scale(.92); }
    .tab-btn{ padding:.34rem .72rem; border-radius:999px; font-size:.8rem; font-weight:700; cursor:pointer; transition:all .2s ease; color:#c9b7a5; background:transparent; border:1px solid rgba(196,168,148,.2); white-space:nowrap; }
    .tab-btn.on{ color:#2a1c12; background:linear-gradient(135deg,#f0d7b6,#cf9b6f 55%,#b5734f); border-color:rgba(240,215,182,.6); box-shadow:0 4px 14px rgba(181,115,79,.4); }
    @media (max-width:820px){
      html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
      #viewport{position:static!important;display:block!important;inset:auto!important;height:auto!important}
      #stage{position:static!important;width:100%!important;max-width:100vw!important;height:auto!important;transform:none!important;padding:14px!important;padding-bottom:118px!important;gap:12px!important;overflow-x:hidden!important}
      #stage header{flex-direction:column!important;align-items:stretch!important;gap:12px!important}
      #stage header > *{width:100%!important;text-align:left!important;border:0!important;justify-content:flex-start!important}
      .glass,.glass-strong{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(28,22,18,.96)!important}
      #grid{grid-template-columns:1fr!important; grid-auto-rows:auto!important; overflow:visible!important; height:auto!important}
      #board{flex:0 0 auto!important; min-height:0!important}
      .card-edu{min-height:0!important}
      #clock,#clockDate{display:none!important} *:has(> #clock){display:none!important}
    }
    @media (min-width:821px){ #eduPP{display:none!important} }
    @media (max-width:820px){
      #eduPP{position:fixed;left:0;right:0;bottom:0;z-index:100000;display:flex;align-items:center;justify-content:center;gap:24px;padding:11px 0 calc(13px + env(safe-area-inset-bottom,0px));background:#1a1310;border-top:1px solid rgba(196,168,148,.18);box-shadow:0 -8px 28px rgba(0,0,0,.55)}
      #eduPP button{width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.05);color:#e8c9a6;display:flex;align-items:center;justify-content:center}
      #eduPP button[data-act="toggle"]{background:linear-gradient(135deg,#f0d7b6,#cf9b6f 55%,#b5734f);color:#2a1c12;width:54px;height:54px;box-shadow:0 4px 16px rgba(181,115,79,.5),0 0 20px rgba(207,155,111,.35)}
      #eduPP svg{width:24px;height:24px;pointer-events:none} #eduPP button[data-act="toggle"] svg{width:26px;height:26px}
    }
  </style>
</head>
<body class="text-stone-100 antialiased">
<div id="viewport"><div id="stage">

  <!-- HEADER -->
  <header class="glass rounded-2xl px-5 py-3 flex items-center justify-between gap-5 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div class="h-12 w-12 rounded-xl grid place-items-center shrink-0" style="background:rgba(181,115,79,.15);border:1px solid rgba(196,140,100,.3)"><i data-lucide="graduation-cap" class="w-7 h-7 text-[#cf9b6f] metric-icon"></i></div>
      <div class="min-w-0">
        <p class="text-2xl font-extrabold tracking-tight leading-none flex items-center gap-2.5">EDUCACIÓN MINERA <span class="fi fi-cl" style="font-size:1.1em;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span></p>
        <p class="text-xs text-stone-400 mt-1 flex items-center gap-2"><i data-lucide="pickaxe" class="w-4 h-4 text-[#cf9b6f]"></i> ADN Minero · carreras, dónde estudiar y becas para la minería de Chile</p>
      </div>
    </div>
    <div class="text-right shrink-0 px-5 border-x border-white/10">
      <p id="clock" class="text-3xl font-bold tracking-tight leading-none tabnum">--:--:--</p>
      <p id="clockDate" class="text-xs text-stone-400 mt-1 capitalize">hora local · Chile</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="flex items-center gap-1.5 mr-1">
        <button class="tab-btn on" data-tab="todos">Todos</button>
        <button class="tab-btn" data-tab="carrera">Carreras</button>
        <button class="tab-btn" data-tab="postgrado">Postgrados</button>
        <button class="tab-btn" data-tab="institucion">Instituciones</button>
        <button class="tab-btn" data-tab="online">Online</button>
        <button class="tab-btn" data-tab="beca">Becas</button>
      </div>
      <button id="prevBtn" class="ctrl-btn" title="Anterior"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      <button id="pauseBtn" class="ctrl-btn" title="Pausar/Reanudar"><i id="pauseIcon" data-lucide="pause" class="w-5 h-5"></i></button>
      <button id="nextBtn" class="ctrl-btn" title="Siguiente"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
    </div>
  </header>
  <div class="h-1.5 rounded-full bg-stone-700/40 overflow-hidden shrink-0"><div id="progress" class="h-full" style="width:0%; background:linear-gradient(90deg,#d9a877,#b5734f)"></div></div>

  <!-- TABLERO -->
  <section id="board" class="flex-1 min-h-0 flex flex-col gap-3">
    <div id="grid" class="grid grid-cols-3 gap-4 flex-1 min-h-0" style="grid-auto-rows:1fr"></div>
    <div class="glass rounded-xl px-5 py-2.5 shrink-0 flex items-center justify-between gap-4">
      <p class="text-[11px] text-stone-500 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4 text-[#cf9b6f]"></i> Orientación referencial · toca una tarjeta para ir al sitio oficial · ADN Minero es un servicio independiente, no representa a las instituciones</p>
      <p id="pageInfo" class="text-[11px] text-stone-400 tabnum">—</p>
    </div>
  </section>

</div></div>

<div id="eduPP" role="group" aria-label="Controles">
  <button data-act="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2.2v12H7zM20 6v12l-9.2-6z"></path></svg></button>
  <button data-act="toggle" aria-label="Pausar o reanudar"><svg id="eduPPicon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"></rect><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"></rect></svg></button>
  <button data-act="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.8 6H17v12h-2.2zM4 6l9.2 6L4 18z"></path></svg></button>
</div>

<script>
  const TZ='America/Santiago';
  const ROTATE_MS=13000, PAGE=6;
  const $=id=>document.getElementById(id);
  const drawIcons=()=>window.lucide&&lucide.createIcons();
  const gsearch=q=>'https://www.google.com/search?q='+encodeURIComponent(q);

  const DATA=[
    // ---- CARRERAS ----
    {tipo:'Carrera', cat:'Universitaria · 6 años', titulo:'Ingeniería Civil de Minas', detalle:'Diseña y planifica la explotación de yacimientos: método de extracción, seguridad y productividad. La carrera insignia de la gran minería.', link:gsearch('Ingeniería Civil de Minas Chile dónde estudiar')},
    {tipo:'Carrera', cat:'Universitaria · 5 años', titulo:'Ingeniería en Minas (Ejecución)', detalle:'Gestiona operaciones mineras en terreno, con foco práctico en producción, equipos y procesos.', link:gsearch('Ingeniería Ejecución en Minas Chile universidades')},
    {tipo:'Carrera', cat:'Universitaria · 5-6 años', titulo:'Geología', detalle:'Estudia la Tierra y los yacimientos: exploración, modelamiento de recursos y evaluación de reservas.', link:gsearch('Geología carrera Chile dónde estudiar minería')},
    {tipo:'Carrera', cat:'Universitaria · 6 años', titulo:'Ingeniería Civil Metalúrgica', detalle:'Procesa los minerales para obtener metales: concentración, fundición, refinación e hidrometalurgia.', link:gsearch('Ingeniería Civil Metalúrgica Chile universidades')},
    {tipo:'Carrera', cat:'Universitaria / Técnica', titulo:'Ingeniería en Prevención de Riesgos', detalle:'Seguridad y salud ocupacional en faenas: clave para operar sin accidentes en minería.', link:gsearch('Ingeniería Prevención de Riesgos minería Chile')},
    {tipo:'Carrera', cat:'Técnico · CFT/IP', titulo:'Técnico en Minería / Explotación Minera', detalle:'Formación práctica para operar y supervisar faenas de extracción, en 2 a 2,5 años.', link:gsearch('Técnico en Minería explotación minera CFT Chile')},
    {tipo:'Carrera', cat:'Técnico · CFT/IP', titulo:'Técnico en Mantención de Maquinaria Minera', detalle:'Mantención de camiones, palas y equipos pesados: una de las áreas más demandadas del sector.', link:gsearch('Técnico mantención maquinaria minera Chile')},
    {tipo:'Carrera', cat:'Técnico · CFT/IP', titulo:'Técnico en Geología / Geomensura', detalle:'Apoyo a la exploración y a la topografía minera: muestreo, sondajes y levantamientos.', link:gsearch('Técnico en Geología Geomensura Chile minería')},
    {tipo:'Carrera', cat:'Técnico · CFT/IP', titulo:'Técnico en Procesamiento de Minerales', detalle:'Operación de plantas concentradoras y procesos de metalurgia extractiva.', link:gsearch('Técnico procesamiento de minerales metalurgia Chile')},
    {tipo:'Carrera', cat:'Capacitación', titulo:'Operador de Equipos Mineros', detalle:'Manejo de camiones de extracción y maquinaria pesada; cursos y certificación para entrar a faena.', link:gsearch('curso operador de equipos mineros Chile capacitación')},
    // ---- POSTGRADOS ----
    {tipo:'Postgrado', cat:'Magíster', titulo:'Magíster en Minería', detalle:'Especialización en planificación minera, geomecánica y gestión de operaciones. Lo imparten universidades como la U. de Chile.', link:gsearch('Magíster en Minería Chile universidad')},
    {tipo:'Postgrado', cat:'Magíster', titulo:'Magíster en Ingeniería Metalúrgica', detalle:'Profundiza en procesamiento de minerales, hidro y pirometalurgia y control de procesos.', link:gsearch('Magíster Ingeniería Metalúrgica Chile')},
    {tipo:'Postgrado', cat:'Magíster / Doctorado', titulo:'Postgrado en Geología', detalle:'Investigación en yacimientos, exploración y ciencias de la Tierra.', link:gsearch('Magíster Doctorado Geología Chile universidad')},
    {tipo:'Postgrado', cat:'MBA / Gestión', titulo:'Magíster en Gestión Minera', detalle:'Liderazgo, negocios y gestión estratégica para la industria minera.', link:gsearch('Magíster Gestión Minera MBA minería Chile')},
    {tipo:'Postgrado', cat:'Diplomado', titulo:'Diplomado en Operaciones Mineras', detalle:'Perfeccionamiento corto para profesionales del rubro, en planificación y productividad.', link:gsearch('Diplomado operaciones mineras Chile')},
    {tipo:'Postgrado', cat:'Diplomado', titulo:'Diplomado en Seguridad Minera', detalle:'Especialización en seguridad operacional y salud ocupacional en faenas.', link:gsearch('Diplomado seguridad y prevención minería Chile')},
    // ---- INSTITUCIONES ----
    {tipo:'Institucion', cat:'Universidad · RM', titulo:'Universidad de Chile', detalle:'Facultad de Cs. Físicas y Matemáticas: Ingeniería Civil de Minas y Geología.', link:'https://ingenieria.uchile.cl/'},
    {tipo:'Institucion', cat:'Universidad · RM', titulo:'Pontificia Universidad Católica', detalle:'Ingeniería con diploma/mención en Minería y recursos minerales.', link:'https://www.ing.uc.cl/'},
    {tipo:'Institucion', cat:'Universidad · Antofagasta', titulo:'Universidad Católica del Norte', detalle:'Referente minero del norte: Ing. Civil de Minas, Metalurgia y Geología.', link:'https://www.ucn.cl/'},
    {tipo:'Institucion', cat:'Universidad · Antofagasta', titulo:'Universidad de Antofagasta', detalle:'Ingeniería en Minas, Geología y Metalurgia en la capital minera de Chile.', link:'https://www.uantof.cl/'},
    {tipo:'Institucion', cat:'Universidad · Biobío', titulo:'Universidad de Concepción', detalle:'Ingeniería Civil de Minas y Geología, con fuerte vínculo con la industria.', link:'https://www.udec.cl/'},
    {tipo:'Institucion', cat:'Universidad · RM', titulo:'Universidad de Santiago (USACH)', detalle:'Ingeniería Civil en Minas e Ingeniería Civil en Metalurgia.', link:'https://www.usach.cl/'},
    {tipo:'Institucion', cat:'Universidad · Atacama', titulo:'Universidad de Atacama', detalle:'Ingeniería en Minas, Geología y Metalurgia en Copiapó.', link:'https://www.uda.cl/'},
    {tipo:'Institucion', cat:'Universidad · Valparaíso', titulo:'U. Técnica Federico Santa María', detalle:'Ingeniería Civil de Minas y programas de recursos y procesos.', link:'https://www.usm.cl/'},
    {tipo:'Institucion', cat:'CFT / IP · nacional', titulo:'INACAP', detalle:'Carreras técnicas y de ingeniería en minería, mantención y procesos, en todo Chile.', link:'https://www.inacap.cl/'},
    {tipo:'Institucion', cat:'IP / CFT · nacional', titulo:'AIEP', detalle:'Técnico en minería, prevención de riesgos y mantención industrial.', link:'https://www.aiep.cl/'},
    {tipo:'Institucion', cat:'IP / CFT · nacional', titulo:'Santo Tomás', detalle:'Técnico en Minería, Geología, Prevención de Riesgos y Mantención, con sedes en zonas mineras.', link:'https://www.santotomas.cl/'},
    {tipo:'Institucion', cat:'IP / CFT · nacional', titulo:'DUOC UC', detalle:'Carreras técnicas de electricidad, mecánica, prevención y construcción, afines a la minería.', link:'https://www.duoc.cl/'},
    {tipo:'Institucion', cat:'Universidad · Coquimbo', titulo:'Universidad de La Serena', detalle:'Ingeniería en Minas y Metalurgia en la Región de Coquimbo.', link:'https://www.userena.cl/'},
    {tipo:'Institucion', cat:'CFT estatal · gratis', titulo:'CFT del Estado (regiones mineras)', detalle:'Centros de Formación Técnica públicos en Tarapacá, Antofagasta, Atacama y Coquimbo, con carreras del rubro.', link:gsearch('CFT estatal Antofagasta Atacama carreras minería')},
    // ---- CURSOS ONLINE ----
    {tipo:'Online', cat:'Plataforma', titulo:'Coursera · Minería y Geología', detalle:'Cursos online de universidades del mundo: geología, sostenibilidad y procesamiento de minerales.', link:'https://www.coursera.org/'},
    {tipo:'Online', cat:'Plataforma', titulo:'edX · Mining & Earth Sciences', detalle:'Cursos y programas de ciencias de la Tierra y minería de universidades internacionales.', link:'https://www.edx.org/'},
    {tipo:'Online', cat:'PUC · online', titulo:'Clase Ejecutiva UC', detalle:'Cursos y diplomados online de la U. Católica, varios de gestión, procesos y minería.', link:'https://www.claseejecutiva.uc.cl/'},
    {tipo:'Online', cat:'Estado · gratis', titulo:'SENCE · Cursos en línea', detalle:'Capacitación gratuita y becas laborales, con oficios y cursos ligados a la minería.', link:'https://www.sence.gob.cl/'},
    {tipo:'Online', cat:'Buscar', titulo:'Cursos gratis de minería', detalle:'Explora MOOCs y cursos gratuitos de minería, geología y seguridad para partir hoy.', link:gsearch('cursos online gratis minería geología Chile')},
    // ---- BECAS Y CAPACITACIÓN ----
    {tipo:'Beca', cat:'Financiamiento', titulo:'Becas y Beneficios (MINEDUC)', detalle:'Gratuidad, becas y créditos para estudiar. Postula en el sistema oficial del Estado.', link:'https://portal.beneficiosestudiantiles.cl/'},
    {tipo:'Beca', cat:'Orientación', titulo:'Mi Futuro · MINEDUC', detalle:'Sueldos, empleabilidad y dónde se imparte cada carrera. Info oficial para decidir bien.', link:'https://www.mifuturo.cl/'},
    {tipo:'Beca', cat:'Capacitación', titulo:'SENCE · Cursos y oficios', detalle:'Cursos gratuitos y becas laborales, varios ligados a la minería y sus oficios.', link:'https://www.sence.gob.cl/'},
    {tipo:'Beca', cat:'Certificación', titulo:'ChileValora · Competencias', detalle:'Certifica competencias laborales del sector minero para mejorar tu empleabilidad.', link:'https://www.chilevalora.cl/'}
  ];

  const norm=s=>(s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let listings=[], filtered=[], page=0, filter='todos', paused=false, rotTimer=null;

  function tick(){ const n=new Date();
    $('clock').textContent=n.toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    $('clockDate').textContent=n.toLocaleDateString('es-CL',{timeZone:TZ,weekday:'long',day:'2-digit',month:'long'})+' · hora Chile';
  }

  const STYLE={
    Carrera:     {c:'#cf9b6f', ic:'graduation-cap', tag:'Carrera',       btn:'Buscar dónde estudiar'},
    Postgrado:   {c:'#d6a94f', ic:'book-open',      tag:'Postgrado',     btn:'Ver programa'},
    Institucion: {c:'#7fbfd1', ic:'building-2',     tag:'Dónde estudiar', btn:'Ver institución'},
    Online:      {c:'#7fbf9a', ic:'monitor',        tag:'Curso online',  btn:'Ir al curso'},
    Beca:        {c:'#a7d18a', ic:'award',          tag:'Beca / apoyo',  btn:'Ver / postular'}
  };

  function card(it){
    const s=STYLE[it.tipo]||STYLE.Carrera;
    return `<div class="card-edu glass-strong rounded-2xl p-5 flex flex-col gap-2.5 relative overflow-hidden transition" data-t="${(it.titulo||'').replace(/"/g,'&#34;')}" style="border-color:${s.c}22;cursor:pointer">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full inline-flex items-center gap-1.5" style="background:${s.c}1f;border:1px solid ${s.c}44;color:${s.c}"><i data-lucide="${s.ic}" class="w-3.5 h-3.5"></i> ${s.tag}</span>
        ${it.cat?`<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full text-stone-300" style="background:${s.c}14;border:1px solid ${s.c}2e">${it.cat}</span>`:''}
      </div>
      <h3 class="text-[18px] font-bold leading-tight">${it.titulo}</h3>
      ${it.detalle?`<p class="text-[13px] text-stone-400 leading-snug flex-1" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${it.detalle}</p>`:'<div class="flex-1"></div>'}
      <p class="text-[11px] font-semibold flex items-center gap-1" style="color:${s.c}">Ver ficha completa <i data-lucide="arrow-right" class="w-3 h-3"></i></p>
      <div class="flex items-center gap-2 flex-wrap">
        <a href="${it.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-semibold rounded-lg px-3 py-2 w-fit active:scale-95 transition" style="color:${s.c};background:${s.c}14;border:1px solid ${s.c}33"><i data-lucide="external-link" class="w-4 h-4"></i> ${s.btn}</a>
        ${it.tipo==='Institucion'?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.titulo+' Chile')}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-[12px] font-semibold rounded-lg px-2.5 py-2 w-fit active:scale-95 transition text-stone-300" style="background:rgba(207,155,111,.1);border:1px solid rgba(207,155,111,.28)"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-[#cf9b6f]"></i> Maps</a>`:''}
      </div>
    </div>`;
  }

  function applyFilter(){ filtered = filter==='todos' ? listings : listings.filter(x=>norm(x.tipo)===filter); if(page>=pages()) page=0; }
  function pages(){ return Math.max(1, Math.ceil(filtered.length/PAGE)); }
  function render(){
    const start=page*PAGE, slice=filtered.slice(start, start+PAGE);
    $('grid').innerHTML = slice.length ? slice.map(card).join('') : `<div class="col-span-3 grid place-items-center text-stone-500 gap-3 py-10"><i data-lucide="inbox" class="w-12 h-12"></i><p>No hay resultados en esta categoría.</p></div>`;
    const total=filtered.length;
    $('pageInfo').textContent = total ? `${Math.min(start+1,total)}–${Math.min(start+slice.length,total)} de ${total} · página ${page+1}/${pages()}` : '0';
    drawIcons();
  }
  function restartProgress(ms){ const p=$('progress'); p.style.transition='none'; p.style.width='0%'; void p.offsetWidth; if(!paused){ p.style.transition='width '+ms+'ms linear'; p.style.width='100%'; } }
  function schedule(){ clearTimeout(rotTimer); if(paused){ return; } if(pages()>1){ restartProgress(ROTATE_MS); rotTimer=setTimeout(next, ROTATE_MS); } else restartProgress(0); }
  function goto(p){ const n=pages(); page=((p%n)+n)%n; render(); schedule(); }
  function next(){ goto(page+1); } function prev(){ goto(page-1); }
  function setFilter(f){ filter=f; page=0; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on', b.dataset.tab===f)); applyFilter(); render(); schedule(); }
  function togglePause(){ paused=!paused; $('pauseIcon').setAttribute('data-lucide', paused?'play':'pause'); drawIcons(); if(paused){ clearTimeout(rotTimer); const p=$('progress'); p.style.transition='none'; p.style.width=getComputedStyle(p).width; } else schedule(); }

  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>setFilter(b.dataset.tab)));
  $('prevBtn').addEventListener('click', prev);
  $('nextBtn').addEventListener('click', next);
  $('pauseBtn').addEventListener('click', togglePause);
  (function(){ var r=$('eduPP'); if(!r) return; var ic=$('eduPPicon'), disp=false;
    var PLAY='<path d="M8 5v14l11-7z"></path>', PAUSE='<rect x="6" y="5" width="4.2" height="14" rx="1.2"></rect><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"></rect>';
    r.addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return; var a=b.getAttribute('data-act');
      if(a==='next') next(); else if(a==='prev') prev(); else { togglePause(); disp=!disp; ic.innerHTML=disp?PLAY:PAUSE; } }); })();

  function updateTabCounts(){
    const n=t=>listings.filter(x=>x.tipo===t).length;
    const set=(sel,txt)=>{ const b=document.querySelector(sel); if(b) b.textContent=txt; };
    set('[data-tab="todos"]','Todos · '+listings.length);
    set('[data-tab="carrera"]','Carreras · '+n('Carrera'));
    set('[data-tab="postgrado"]','Postgrados · '+n('Postgrado'));
    set('[data-tab="institucion"]','Instituciones · '+n('Institucion'));
    set('[data-tab="online"]','Online · '+n('Online'));
    set('[data-tab="beca"]','Becas · '+n('Beca'));
  }
  function load(){ listings=DATA.slice(); updateTabCounts(); applyFilter(); render(); schedule(); }

  // ===== FICHA DETALLE (tocar una tarjeta) =====
  const EXTRA={
    'Ingeniería Civil de Minas':{campo:'Planificación y dirección de operaciones en la gran minería, consultoras y el Estado.',demanda:92,sueldo:'Alto — de las carreras mejor pagadas de Chile.',ramos:['Explotación de minas','Geomecánica','Planificación minera','Economía minera']},
    'Ingeniería en Minas (Ejecución)':{campo:'Supervisión de operaciones en terreno y jefaturas de turno en faena.',demanda:85,sueldo:'Alto.',ramos:['Operaciones mineras','Equipos y flota','Ventilación','Seguridad']},
    'Geología':{campo:'Exploración, modelamiento de recursos, minería e investigación.',demanda:80,sueldo:'Alto.',ramos:['Mineralogía','Yacimientos','Geología estructural','Sondajes']},
    'Ingeniería Civil Metalúrgica':{campo:'Plantas concentradoras, fundiciones y refinerías de cobre.',demanda:82,sueldo:'Alto.',ramos:['Flotación','Hidrometalurgia','Pirometalurgia','Control de procesos']},
    'Ingeniería en Prevención de Riesgos':{campo:'Departamentos de seguridad y salud ocupacional en faenas.',demanda:88,sueldo:'Medio-alto.',ramos:['Higiene ocupacional','Normativa','Emergencias','Ergonomía']},
    'Técnico en Minería / Explotación Minera':{campo:'Operación y supervisión directa de faenas de extracción.',demanda:90,sueldo:'Medio-alto para técnico.',ramos:['Perforación','Tronadura','Carguío y transporte']},
    'Técnico en Mantención de Maquinaria Minera':{campo:'Mantención de camiones, palas y equipos pesados.',demanda:95,sueldo:'Medio-alto; muy demandado.',ramos:['Mecánica','Hidráulica','Electricidad','Diagnóstico']},
    'Técnico en Geología / Geomensura':{campo:'Apoyo a la exploración y a la topografía minera.',demanda:78,sueldo:'Medio.',ramos:['Topografía','Muestreo','Sondajes','Cartografía']},
    'Técnico en Procesamiento de Minerales':{campo:'Operación de plantas concentradoras y metalurgia extractiva.',demanda:80,sueldo:'Medio-alto.',ramos:['Molienda','Flotación','Espesamiento','Control de calidad']},
    'Operador de Equipos Mineros':{campo:'Conducción de camiones de extracción (CAEX) y maquinaria pesada.',demanda:93,sueldo:'Bueno para su nivel; alta demanda.',ramos:['Manejo de CAEX','Seguridad','Mantención básica']}
  };
  // inyectar estilos y overlay (fuera del #stage escalado)
  document.head.insertAdjacentHTML('beforeend', `<style>
    #ovE{position:fixed;inset:0;z-index:2000;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(10,8,7,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    #ovE.on{display:block;animation:ovEin .25s ease both} @keyframes ovEin{from{opacity:0}to{opacity:1}}
    #ovE .sheet{max-width:680px;margin:0 auto;min-height:100%;padding:16px 16px 48px;color:#f4ece5}
    #ovE .panel{animation:ovEup .3s cubic-bezier(.2,.7,.3,1) both} @keyframes ovEup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    #ovEclose{position:sticky;top:8px;margin-left:auto;z-index:5;display:grid;place-items:center;width:42px;height:42px;border-radius:999px;cursor:pointer;background:linear-gradient(160deg,rgba(48,41,35,.95),rgba(28,23,19,.9));border:1px solid rgba(196,168,148,.25);color:#e8c9a6;box-shadow:0 6px 18px rgba(0,0,0,.5)}
    #ovE .dtrack{height:14px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
    #ovE .dbar{height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.7,.3,1)}
  </style>`);
  document.body.insertAdjacentHTML('beforeend', '<div id="ovE"><div class="sheet"><button id="ovEclose" aria-label="Cerrar"><i data-lucide="x" style="width:22px;height:22px"></i></button><div id="ovEp" class="panel"></div></div></div>');

  function openEdu(t){
    const it=DATA.find(x=>x.titulo===t); if(!it) return;
    const s=STYLE[it.tipo]||STYLE.Carrera; const ex=EXTRA[t];
    let html=`
      <div class="text-center">
        <div class="inline-grid place-items-center h-16 w-16 rounded-2xl mx-auto" style="background:${s.c}1e;border:1px solid ${s.c}4d"><i data-lucide="${s.ic}" style="width:30px;height:30px;color:${s.c}"></i></div>
        ${it.cat?`<span class="inline-block text-[12px] font-bold px-3 py-1 rounded-full mt-3" style="background:${s.c}22;color:${s.c};border:1px solid ${s.c}55">${it.cat}</span>`:''}
        <h2 class="text-2xl sm:text-3xl font-extrabold mt-2">${it.titulo}</h2>
        <p class="text-[12px] mt-1" style="color:${s.c}">${s.tag}</p>
      </div>
      <div class="glass rounded-2xl p-5 mt-5"><p class="text-[15px] leading-relaxed" style="color:#e8ddd2">${it.detalle||''}</p></div>`;
    if(ex){
      html+=`<div class="glass rounded-2xl p-4 mt-4"><p class="text-sm font-bold flex items-center gap-2"><i data-lucide="briefcase" class="w-4 h-4" style="color:${s.c}"></i> Dónde trabajarás</p><p class="text-[14px] mt-1" style="color:#d8c8b8">${ex.campo}</p></div>`;
      html+=`<div class="glass rounded-2xl p-4 mt-4"><p class="text-sm font-bold flex items-center gap-2 mb-2"><i data-lucide="bar-chart-3" class="w-4 h-4" style="color:${s.c}"></i> Demanda en la minería <span class="text-[11px] font-normal text-stone-500">referencial</span></p><div class="dtrack"><div class="dbar" data-w="${ex.demanda}%" style="background:linear-gradient(90deg,${s.c},#b5734f)"></div></div><p class="text-[12px] text-stone-400 mt-2">${ex.demanda>=90?'Muy alta':ex.demanda>=80?'Alta':'Media-alta'} · 💰 Sueldo: ${ex.sueldo}</p></div>`;
      html+=`<div class="glass rounded-2xl p-4 mt-4"><p class="text-sm font-bold flex items-center gap-2 mb-2"><i data-lucide="list-checks" class="w-4 h-4" style="color:${s.c}"></i> Algunos ramos / áreas</p><div class="flex flex-wrap gap-2">${ex.ramos.map(r=>`<span class="text-[12px] font-semibold px-2.5 py-1 rounded-full" style="background:${s.c}16;border:1px solid ${s.c}33;color:${s.c}">${r}</span>`).join('')}</div></div>`;
    } else {
      html+=`<div class="glass rounded-2xl p-4 mt-4"><p class="text-sm" style="color:#d8c8b8"><b style="color:${s.c}">${s.tag}.</b> Toca el botón para ir al sitio oficial y ver requisitos, programas y postulación.</p></div>`;
    }
    html+=`<a href="${it.link}" target="_blank" rel="noopener" class="w-full rounded-2xl py-3.5 mt-4 font-bold flex items-center justify-center gap-2 active:scale-95 transition" style="background:${s.c}1e;border:1px solid ${s.c}4d;color:${s.c}"><i data-lucide="external-link" style="width:18px;height:18px"></i> ${s.btn}</a>`;
    if(it.tipo==='Institucion') html+=`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.titulo+' Chile')}" target="_blank" rel="noopener" class="w-full rounded-2xl py-3 mt-3 font-bold flex items-center justify-center gap-2 text-stone-300" style="background:rgba(207,155,111,.1);border:1px solid rgba(207,155,111,.28)"><i data-lucide="map-pin" style="width:18px;height:18px" class="text-[#cf9b6f]"></i> Ver en Google Maps</a>`;
    html+=`<button onclick="closeEdu()" class="w-full rounded-2xl py-3 mt-3 font-bold flex items-center justify-center gap-2 active:scale-95 transition text-stone-300" style="background:rgba(255,255,255,.04);border:1px solid rgba(196,168,148,.18)"><i data-lucide="arrow-left" style="width:18px;height:18px"></i> Volver</button>`;
    $('ovEp').innerHTML=html; $('ovE').classList.add('on'); document.body.style.overflow='hidden'; $('ovE').scrollTop=0;
    clearTimeout(rotTimer); drawIcons();
    if(ex) requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#ovEp .dbar').forEach(b=>b.style.width=b.dataset.w)));
    try{ history.pushState({e:1},''); }catch(e){}
  }
  function closeEdu(){ $('ovE').classList.remove('on'); document.body.style.overflow=''; if(!paused) schedule(); }
  window.closeEdu=closeEdu;
  $('grid').addEventListener('click', e=>{ if(e.target.closest('a')) return; const c=e.target.closest('.card-edu'); if(c&&c.dataset.t) openEdu(c.dataset.t); });
  $('ovEclose').addEventListener('click', closeEdu);
  $('ovE').addEventListener('click', e=>{ if(e.target.id==='ovE') closeEdu(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&$('ovE').classList.contains('on')) closeEdu(); });
  window.addEventListener('popstate', ()=>{ if($('ovE').classList.contains('on')) closeEdu(); });

  function fitStageInit(){ function f(){ const w=innerWidth||1600,h=innerHeight||900; $('stage').style.setProperty('--s',Math.min(w/1600,h/900)||1); } addEventListener('resize',f); addEventListener('load',f); f(); }
  fitStageInit(); drawIcons(); tick(); setInterval(tick,1000); load();
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearTimeout(rotTimer); } else if(!paused){ schedule(); } });
</script>
</body>
</html>
